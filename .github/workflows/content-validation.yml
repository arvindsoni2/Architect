name: Content validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate catalogue and local links
        run: python3 scripts/validate_repository.py

      - name: Test repository validator
        run: python3 -m unittest tests/test_validate_repository.py -v

      - name: Test AWS SAA-C03 resources
        run: python3 -m unittest discover -s handbooks/aws-saa-c03/tests -p 'test_*.py' -v

      - name: Test software architect programme and local lab
        run: |
          node --test learning-paths/software-architect/tests/test_programme.cjs
          python3 -m unittest discover -s learning-paths/software-architect/tests -p 'test_*.py' -v

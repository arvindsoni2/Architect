      "intro": "<b>Start at step 01 below.</b> Fedora + ready-to-run reference code + guided AWS Console steps. AI and CI/CD are optional. Complete local checks before creating billable resources. The numbered steps, including cleanup, are the primary route for this pilot.",
      "help": "<p><b>No model is required to complete this lab.</b> Use the reference code unchanged first. Small models are most useful with one function, one error or one concept at a time.</p>\n<table><thead><tr><th>Task</th><th>Suggested starting point</th><th>Limit</th></tr></thead><tbody>\n<tr><td>Explain a command; small Python edit</td><td>Qwen2.5-Coder-3B-Instruct, using a suitable 4-bit local build, is a small candidate to trial.</td><td>Not benchmarked on this lab; not a guaranteed minimum. Prefer an already working local model over installing another just for the lab.</td></tr>\n<tr><td>Use an existing Qwen3.8 or Ornith1.5 model</td><td>Record the exact model ID, parameter size, quantisation, runtime and context setting; try one bounded task.</td><td>Family names alone do not establish RAM fit, speed or reliable tool use. No hardware-fit claim is made here.</td></tr>\n<tr><td>Harder explanation or a failed small-model repair</td><td>OpenCode's currently available free model, including Muse Spark 1.3 Contributor Free if still offered.</td><td>Temporary availability. OpenCode states that this Contributor option permits prompts/completions to train future Meta models. Use only synthetic/public material if you accept that trade-off; otherwise use a local model. Check /models and current pricing; never send secrets.</td></tr>\n<tr><td>Multi-service IAM/networking failures</td><td>Use the deterministic checks in Build &amp; Deploy first; if necessary use a stronger assistant later with the resume prompt.</td><td>Do not give a small model unsupervised authority to rewrite policies or provision/delete the stack.</td></tr></tbody></table>\n<p><b>How to choose the smallest useful helper:</b> ask the candidate to explain why /health can return 200 while /books returns 503, then request one small validation change in app.py and a test. Inspect its answer, run local checks, and record the exact model and result. If it fails twice, restore the supplied file and continue the lab without AI, or try a stronger helper. A single successful edit does not validate the model for all AWS tasks.</p>\n<p>OpenCode: start in the lab folder, use <code>/models</code> to select an available configured model, then paste one prompt below. A local model provider must already be configured; the lab does not depend on installing OpenCode. A chat interface also works—you can apply a reviewed patch yourself.</p>\n<p><b>Sources checked 19 September 2026:</b> <a href=\"https://huggingface.co/Qwen/Qwen2.5-Coder-3B-Instruct\" target=\"_blank\" rel=\"noopener\">Qwen model card</a>; <a href=\"https://opencode.ai/docs/zen/\" target=\"_blank\" rel=\"noopener\">OpenCode Zen models, pricing and data-use terms</a>. These establish product details, not a lab-specific benchmark.</p>",
      "sources": "<p>Reference checks: <a href=\"https://docs.aws.amazon.com/linux/al2023/ug/python.html\" target=\"_blank\" rel=\"noopener\">Python on Amazon Linux 2023</a>; <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-secrets-manager.html\" target=\"_blank\" rel=\"noopener\">RDS-managed credentials</a>; <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/UsingWithRDS.SSL.html\" target=\"_blank\" rel=\"noopener\">RDS TLS</a>; <a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/asg-instance-refresh.html\" target=\"_blank\" rel=\"noopener\">instance refresh</a>. Console labels can change; match the stated setting and verify the resulting resource.</p>",
      "starter": "bash <<'SHELFLIFE_STARTER'\nset -eu\nfor name in requirements.txt app.py schema.sql seed.sql shelflife.service env.sh local-up.sh smoke.py deploy.sh .gitignore; do\n  if [ -e \"$name\" ]; then echo \"STOP: $name already exists; inspect before overwriting\"; exit 1; fi\ndone\ncat > 'requirements.txt' <<'SHELFLIFE_FILE_0'\nFlask>=3.1,<4\nPyMySQL[rsa]>=1.1.1,<2\nboto3>=1.40,<2\ngunicorn>=23,<24\nSHELFLIFE_FILE_0\nprintf 'Created %s\\n' 'requirements.txt'\ncat > 'app.py' <<'SHELFLIFE_FILE_1'\nimport json\nimport os\nimport time\nimport threading\nimport urllib.request\nfrom contextlib import closing\nfrom pathlib import Path\n\nimport boto3\nimport pymysql\nfrom botocore.exceptions import BotoCoreError, ClientError\nfrom flask import Flask, jsonify, request\n\napp = Flask(__name__)\napp.config['MAX_CONTENT_LENGTH'] = 16384\n_cache = {}\n_lock = threading.Lock()\n\ndef identity():\n    if os.getenv('APP_MODE', 'local') == 'local':\n        return {'instance_id': 'local', 'az': 'local'}\n    if 'identity' not in _cache:\n        # Disable proxies for the link-local metadata endpoint. IMDSv2 only.\n        opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))\n        base = 'http://169.254.169.254/latest/'\n        req = urllib.request.Request(base+'api/token', method='PUT',\n            headers={'X-aws-ec2-metadata-token-ttl-seconds': '60'})\n        with opener.open(req, timeout=2) as response:\n            token = response.read().decode()\n        req = urllib.request.Request(base+'dynamic/instance-identity/document',\n            headers={'X-aws-ec2-metadata-token': token})\n        with opener.open(req, timeout=2) as response:\n            doc = json.load(response)\n        _cache['identity'] = {'instance_id': doc['instanceId'], 'az': doc['availabilityZone']}\n    return _cache['identity']\n\ndef db_settings(force=False):\n    if os.getenv('APP_MODE', 'local') == 'local':\n        return dict(host='127.0.0.1', port=3307, user='shelflife',\n                    password=os.environ['MYSQL_PASSWORD'])\n    with _lock:\n        if force or time.monotonic() >= _cache.get('expires', 0):\n            region = os.environ['AWS_DEFAULT_REGION']\n            db = boto3.client('rds', region_name=region).describe_db_instances(\n                DBInstanceIdentifier=os.environ['DB_INSTANCE'])['DBInstances'][0]\n            secret = boto3.client('secretsmanager', region_name=region).get_secret_value(\n                SecretId=db['MasterUserSecret']['SecretArn'])\n            value = json.loads(secret['SecretString'])\n            _cache['db'] = dict(host=db['Endpoint']['Address'], port=db['Endpoint']['Port'],\n                user=value['username'], password=value['password'],\n                ssl_ca=str(Path(__file__).with_name('global-bundle.pem')),\n                ssl_verify_cert=True, ssl_verify_identity=True)\n            _cache['expires'] = time.monotonic()+60\n        return dict(_cache['db'])\n\ndef connect():\n    def open_db(force=False):\n        return pymysql.connect(**db_settings(force), database='shelflife',\n            connect_timeout=5, read_timeout=10, write_timeout=10,\n            cursorclass=pymysql.cursors.DictCursor, autocommit=False)\n    try:\n        return open_db()\n    except pymysql.OperationalError:\n        # Retry connection setup only: resolve a rotated secret or changed endpoint.\n        # Never replay a write when the commit result is unknown.\n        return open_db(force=True)\n\ndef migrate():\n    with closing(connect()) as db, db.cursor() as cur:\n        cur.execute(\"SELECT GET_LOCK('shelflife-migration', 60) AS acquired\")\n        if cur.fetchone()['acquired'] != 1:\n            raise RuntimeError('Migration lock timed out; retry after checking database')\n        try:\n            for name in ('schema.sql', 'seed.sql'):\n                for statement in Path(__file__).with_name(name).read_text().split(';'):\n                    if statement.strip():\n                        cur.execute(statement)\n            db.commit()\n        finally:\n            cur.execute(\"SELECT RELEASE_LOCK('shelflife-migration')\")\n\n@app.get('/health')\ndef health():\n    # No database calls. Green process health does not prove database recovery.\n    return jsonify(status='ok', **identity())\n\n@app.get('/whoami')\ndef whoami():\n    return jsonify(**identity())\n\n@app.get('/books')\ndef books():\n    with closing(connect()) as db, db.cursor() as cur:\n        cur.execute('SELECT id,title,author,stock FROM books ORDER BY id')\n        return jsonify(cur.fetchall())\n\n@app.post('/books')\ndef create_book():\n    body=request.get_json(silent=True)\n    if (not isinstance(body,dict) or\n        any(not isinstance(body.get(k),str) or not 1 <= len(body[k].strip()) <= 200\n            for k in ('title','author')) or\n        type(body.get('stock')) is not int or not 0 <= body['stock'] <= 1000000):\n        return jsonify(error='Provide title, author (1–200 characters), and integer stock 0–1000000'),400\n    with closing(connect()) as db, db.cursor() as cur:\n        cur.execute('INSERT INTO books(title,author,stock) VALUES (%s,%s,%s)',\n                    (body['title'].strip(),body['author'].strip(),body['stock']))\n        book_id=cur.lastrowid\n        db.commit()\n    return jsonify(id=book_id),201\n\n@app.post('/books/<int:book_id>/buy')\ndef buy(book_id):\n    with closing(connect()) as db, db.cursor() as cur:\n        db.begin()\n        cur.execute('SELECT stock FROM books WHERE id=%s FOR UPDATE',(book_id,))\n        row=cur.fetchone()\n        if not row:\n            db.rollback()\n            return jsonify(error='Book not found'),404\n        if row['stock'] <= 0:\n            db.rollback()\n            return jsonify(error='Out of stock'),409\n        cur.execute('UPDATE books SET stock=stock-1 WHERE id=%s',(book_id,))\n        db.commit()\n    return jsonify(id=book_id,stock=row['stock']-1)\n\n@app.errorhandler(pymysql.MySQLError)\n@app.errorhandler(BotoCoreError)\n@app.errorhandler(ClientError)\ndef database_error(exc):\n    # Keep credentials and SQL details out of the response and application logs.\n    app.logger.error(json.dumps({'event':'database_error','type':type(exc).__name__}))\n    message = ('Write outcome uncertain; check stored data before trying again'\n               if request.method=='POST' else 'Database temporarily unavailable')\n    return jsonify(error=message),503\n\n@app.after_request\ndef log_response(response):\n    app.logger.info(json.dumps({'event':'request','method':request.method,\n                               'path':request.path,'status':response.status_code}))\n    return response\n\nif __name__ == '__main__':\n    import sys\n    if sys.argv[1:] == ['migrate']:\n        migrate()\n        print('Schema and seed ready; existing stock preserved')\n    else:\n        raise SystemExit('Use: python app.py migrate OR gunicorn -b 127.0.0.1:8000 app:app')\nSHELFLIFE_FILE_1\nprintf 'Created %s\\n' 'app.py'\ncat > 'schema.sql' <<'SHELFLIFE_FILE_2'\nCREATE TABLE IF NOT EXISTS books (\n  id INT PRIMARY KEY AUTO_INCREMENT,\n  title VARCHAR(200) NOT NULL,\n  author VARCHAR(200) NOT NULL,\n  stock INT NOT NULL CHECK (stock >= 0)\n) ENGINE=InnoDB;\nSHELFLIFE_FILE_2\nprintf 'Created %s\\n' 'schema.sql'\ncat > 'seed.sql' <<'SHELFLIFE_FILE_3'\nINSERT IGNORE INTO books(id,title,author,stock) VALUES\n(1,'Pride and Prejudice','Jane Austen',10),\n(2,'Jane Eyre','Charlotte Bronte',10),\n(3,'Great Expectations','Charles Dickens',10),\n(4,'Frankenstein','Mary Shelley',10),\n(5,'Dracula','Bram Stoker',10),\n(6,'The Odyssey','Homer',10),\n(7,'The Time Machine','H. G. Wells',10),\n(8,'Treasure Island','Robert Louis Stevenson',10),\n(9,'Little Women','Louisa May Alcott',10),\n(10,'The Secret Garden','Frances Hodgson Burnett',10),\n(11,'Moby Dick','Herman Melville',10),\n(12,'The Adventures of Sherlock Holmes','Arthur Conan Doyle',10);\nSHELFLIFE_FILE_3\nprintf 'Created %s\\n' 'seed.sql'\ncat > 'shelflife.service' <<'SHELFLIFE_FILE_4'\n[Unit]\nDescription=ShelfLife learning application\nAfter=network-online.target\nWants=network-online.target\n\n[Service]\nUser=appuser\nWorkingDirectory=/opt/app\nEnvironment=APP_MODE=aws\nEnvironment=DB_INSTANCE=shelflife-db\nEnvironment=AWS_DEFAULT_REGION=us-east-1\nExecStartPre=/opt/app/venv/bin/python /opt/app/app.py migrate\nExecStart=/opt/app/venv/bin/gunicorn -b 0.0.0.0:8000 -w 2 --access-logfile - --error-logfile - app:app\nRestart=on-failure\nRestartSec=15\nTimeoutStartSec=180\n\n[Install]\nWantedBy=multi-user.target\nSHELFLIFE_FILE_4\nprintf 'Created %s\\n' 'shelflife.service'\ncat > 'env.sh' <<'SHELFLIFE_FILE_5'\n# Source this file from the lab folder: source ./env.sh\nexport AWS_PROFILE=shelflife\nexport AWS_DEFAULT_REGION=us-east-1\nexport AWS_PAGER=''\nif [[ -f lab.env ]]; then\n  set -a\n  source ./lab.env\n  set +a\nfi\nrecord() {\n  [[ \"$1\" =~ ^[A-Z][A-Z0-9_]*$ && -n \"$2\" && \"$2\" != None ]] || return 1\n  printf '%s=%q\\n' \"$1\" \"$2\" >> lab.env\n  export \"$1=$2\"\n}\ncheck_account() {\n  local observed\n  observed=$(aws sts get-caller-identity --query Account --output text) || return 1\n  [[ -n \"${ACCOUNT_ID:-}\" && \"$observed\" == \"$ACCOUNT_ID\" ]] || {\n    echo 'STOP: account differs from lab.env. Check your sign-in.' >&2; return 1;\n  }\n}\nSHELFLIFE_FILE_5\nprintf 'Created %s\\n' 'env.sh'\ncat > 'local-up.sh' <<'SHELFLIFE_FILE_6'\n#!/usr/bin/env bash\nset -euo pipefail\ncd \"$(dirname \"$0\")\"\nif [[ ! -f local.env ]]; then\n  umask 077\n  python3 - <<'PY'\nimport secrets\nfrom pathlib import Path\nPath('local.env').write_text('MYSQL_DATABASE=shelflife\\nMYSQL_USER=shelflife\\n'\n    + 'MYSQL_PASSWORD='+secrets.token_hex(24)+'\\n'\n    + 'MYSQL_ROOT_PASSWORD='+secrets.token_hex(24)+'\\n')\nPY\nfi\nif podman container exists shelflife-mysql; then\n  podman start shelflife-mysql >/dev/null\nelse\n  podman run -d --name shelflife-mysql --env-file local.env \\\n    -p 127.0.0.1:3307:3306 docker.io/library/mysql:8.4\nfi\nset -a\nsource ./local.env\nset +a\nexport APP_MODE=local\npython3.11 -m venv .venv\n.venv/bin/pip install -r requirements.txt\n.venv/bin/pip freeze > requirements.lock.txt\nready=false\nfor attempt in $(seq 1 60); do\n  if .venv/bin/python app.py migrate; then ready=true; break; fi\n  sleep 5\ndone\n[[ \"$ready\" == true ]] || { echo 'MySQL not ready. Run: podman logs shelflife-mysql'; exit 1; }\nexec .venv/bin/gunicorn -b 127.0.0.1:8000 -w 2 --access-logfile - --error-logfile - app:app\nSHELFLIFE_FILE_6\nprintf 'Created %s\\n' 'local-up.sh'\ncat > 'smoke.py' <<'SHELFLIFE_FILE_7'\nimport collections\nimport concurrent.futures\nimport json\nimport sys\nimport urllib.error\nimport urllib.request\n\nbase=sys.argv[1].rstrip('/') if len(sys.argv)>1 else 'http://127.0.0.1:8000'\ndef call(path, data=None):\n    req=urllib.request.Request(base+path,\n        data=json.dumps(data).encode() if data is not None else None,\n        headers={'Content-Type':'application/json'})\n    try:\n        with urllib.request.urlopen(req, timeout=20) as r:\n            return r.status,json.load(r)\n    except urllib.error.HTTPError as e:\n        return e.code,json.load(e)\nstatus,health=call('/health')\nassert status==200 and health['status']=='ok',(status,health)\nstatus,books=call('/books')\nassert status==200 and len(books)>=12,(status,books)\nstatus,created=call('/books',{'title':'Concurrency test','author':'Synthetic','stock':5})\nassert status==201,(status,created)\nbook_id=created['id']\nwith concurrent.futures.ThreadPoolExecutor(max_workers=10) as pool:\n    responses=list(pool.map(lambda _:call(f'/books/{book_id}/buy',{}),range(50)))\ncounts=collections.Counter(s for s,_ in responses)\nassert counts=={200:5,409:45},counts\n_,books=call('/books')\nassert next(b['stock'] for b in books if b['id']==book_id)==0\nprint('PASS: health, seed data, create; 50 buys = 5 successes + 45 sold-out responses; stock=0')\nprint('This creates one synthetic book         "c": "import json\n# ddb = boto3.client(\"dynamodb\"); tables: processed(orderId), inventory(sku), outbox(eventId).\n# Contract: one immutable order ID, one SKU and a positive integer quantity.\ndef handle(order):\n    qty = order[\"qty\"]\n    if not isinstance(qty, int) or isinstance(qty, bool) or qty <= 0:\n        raise ValueError(\"qty must be a positive integer\")\n    oid = order[\"orderId\"]\n    try:\n        ddb.transact_write_items(TransactItems=[\n            {\"Put\":{\"TableName\":\"processed\",\"Item\":{\"orderId\":{\"S\":oid}},\n                \"ConditionExpression\":\"attribute_not_exists(orderId)\"}},\n            {\"Update\":{\"TableName\":\"inventory\",\"Key\":{\"sku\":{\"S\":order[\"sku\"]}},\n                \"UpdateExpression\":\"SET stock = stock - :qty\",\n                \"ConditionExpression\":\"attribute_exists(sku) AND stock >= :qty\",\n                \"ExpressionAttributeValues\":{\":qty\":{\"N\":str(qty)}}}},\n            {\"Put\":{\"TableName\":\"outbox\",\"Item\":{\"eventId\":{\"S\":oid},\n                \"payload\":{\"S\":json.dumps(order)},\"status\":{\"S\":\"PENDING\"}},\n                \"ConditionExpression\":\"attribute_not_exists(eventId)\"}}\n        ])\n    except ddb.exceptions.TransactionCanceledException:\n        # Only a committed marker proves this order completed the atomic write.\n        if ddb.get_item(TableName=\"processed\",Key={\"orderId\":{\"S\":oid}},\n                        ConsistentRead=True).get(\"Item\"):\n            return \"duplicate\"\n        raise  # Insufficient stock, contention, or another failure must not disappear.\n    return \"accepted\"\n# Separate publisher: scan/stream PENDING outbox records, publish eventId, then\n# mark SENT. A crash after publish can duplicate delivery: downstream consumers\n# must deduplicate eventId. Never delete pending records on a failed publish.\n# This guarantees atomic database effects, NOT universal exactly-once delivery."

    "design": [
      {
        "h": "Why build RAG by hand once",
        "b": "Every component you wire manually — chunker, embedder, store, retriever, prompt assembly — is a failure mode you can now diagnose. When retrieval returns garbage you'll check chunk boundaries; when answers hallucinate you'll check grounding and k. Then you can articulate exactly what Bedrock KB (or a retrieval framework) is abstracting, and what it costs to abstract it."
      },
      {
        "h": "RAG vs fine-tuning vs prompt engineering",
        "b": "The AIF-C01 triangle, now with receipts: prompt engineering (cheapest, no new knowledge), RAG (fresh/private knowledge, citable, updateable by re-indexing), fine-tuning (style/format/domain behaviour, expensive, knowledge frozen at training). \"Answers must reflect documents updated daily\" → RAG, never fine-tuning."
      },
      {
        "h": "Trust boundaries",
        "b": "Retrieved chunks are DATA, and user questions are UNTRUSTED — the prompt template separates instructions from both. Log every prompt+response to CloudWatch for audit. Least-privilege: the query Lambda can read the vector index and invoke exactly two model ARNs, nothing else."
      }
    ],
    "concepts": [
      {
        "h": "Bedrock platform map",
        "b": "Model catalogue (Anthropic, Amazon Nova/Titan, Meta, Mistral…), Converse API (uniform invoke), Knowledge Bases (RAG), Agents (Lab 11), Guardrails, Model Evaluation, Fine-tuning/continued pre-training, Provisioned Throughput, Batch inference (50% off, async). IAM-governed, data NOT used to train base models — the enterprise pitch."
      },
      {
        "h": "Embeddings & similarity",
        "b": "Cosine similarity over dense vectors; dimensions trade quality vs storage; chunk size trades context vs precision. Hybrid search (vector + keyword) and reranking are the next dials — name them, don't build them."
      },
      {
        "h": "Token economics",
        "b": "Cost = input tokens (your prompt INCLUDING retrieved chunks) + output tokens. RAG inflates input tokens — k=20 chunks of 500 tokens is 10k tokens per question. Right-sizing k is both a quality and a cost decision."
      },
      {
        "h": "Evaluation of RAG",
        "b": "Two layers: retrieval quality (did the right chunks surface? hit-rate on a golden set) and generation quality (faithfulness, relevance — RAGAS-style metrics, which you already know). Bedrock Model Evaluation offers automatic + human pipelines."
      },
      {
        "h": "Responsible AI hooks",
        "b": "Guardrails (input+output filtering), grounding checks, PII masking, watermark detection for images, model cards. AIF-C01's responsible-AI domain mapped to concrete switches you have now flipped."

    "traps": [
      "Do not accept a managed vector-store default without reading its pricing model. OpenSearch Serverless has material OCU cost even when query volume is low. For a small learning corpus, prefer S3 Vectors or an existing PostgreSQL pgvector deployment and verify current prices before provisioning.",
      "Bedrock access is generally enabled by default with required permissions; verify provider conditions, Region, model lifecycle and actual authorization when diagnosing AccessDenied.",
      "Embedding model mismatch between index-time and query-time returns plausible-looking nonsense — no error is raised. Pin both embedding and generation model IDs in deployment configuration and validate their lifecycle before indexing or querying.",
      "Temperature ~1.0 on a grounded Q&A bot manufactures hallucinations; grounded tasks want 0–0.3. Inference-parameter questions are AIF-C01 staples.",
      "Provisioned Throughput is for sustained production load — buying it for a lab burns hundreds of dollars in hours."
    ],
    "snippets": [
      {
        "t": "Query pipeline core",
        "c": "import boto3, json, os\nbr = boto3.client(\"bedrock-runtime\")\ns3v = boto3.client(\"s3vectors\")\nEMBED = os.environ.get(\"BEDROCK_EMBEDDING_MODEL_ID\", \"amazon.titan-embed-text-v2:0\")\nLLM   = os.environ[\"BEDROCK_GENERATION_MODEL_ID\"]\n\ndef embed(text):\n    r = br.invoke_model(modelId=EMBED, body=json.dumps({\"inputText\": text}))\n    return json.loads(r[\"body\"].read())[\"embedding\"]\n\ndef ask(question, history=None):\n    hits = s3v.query_vectors(vectorBucketName=\"documind-vec\",\n        indexName=\"corpus\", queryVector={\"float32\": embed(question)},\n        topK=4, returnMetadata=True)[\"vectors\"]\n    context = \"\\n\\n\".join(\n        f\"[{h['metadata']['source']}]\\n{h['metadata']['text']}\" for h in hits)\n    prompt = (\"Answer ONLY from the context. Cite [source] per claim. \"\n              \"If the context is insufficient, say so.\\n\\n\"\n              f\"<context>\\n{context}\\n</context>\\n\\nQuestion: {question}\")\n    r = br.converse(modelId=LLM,\n        messages=(history or []) + [{\"role\":\"user\",\"content\":[{\"text\":prompt}]}],\n        inferenceConfig={\"temperature\":0.2,\"maxTokens\":700},\n        guardrailConfig={\"guardrailIdentifier\":os.environ[\"BEDROCK_GUARDRAIL_ID\"],\"guardrailVersion\":os.environ[\"BEDROCK_GUARDRAIL_VERSION\"]})\n    return r[\"output\"][\"message\"][\"content\"][0][\"text\"], hits"
      },
      {
        "t": "Chunker worth stealing",
        "c": "def chunk(md_text, source, max_tokens=500, overlap=50):\n    # Word-count proxy, NOT a model tokenizer. Formatting is normalized.\n    # Production ingestion should use the selected model tokenizer and preserve metadata.\n    if max_tokens <= 0 or overlap < 0 or overlap >= max_tokens:\n        raise ValueError(\"require 0 <= overlap < max_tokens\")\n    words = md_text.split()\n    out = []\n    start = 0\n    while start < len(words):\n        end = min(start + max_tokens, len(words))\n        out.append({\"text\":\" \".join(words[start:end]),\"source\":source})\n        if end == len(words): break\n        start = end - overlap\n    return out"
      }
    ],

    "handoff": "# Codex handoff — Lab 10: DocuMind RAG\n\n## Context\nManual RAG on Bedrock: configured embedding model -> S3 Vectors -> active generation model via\nConverse, Guardrails attached. Corpus = my markdown study notes in\nlabs/l10-documind/corpus/. us-east-1. I know LangChain/LangGraph well —\ndeliberately do NOT use them; raw boto3 so I see every seam.\n\n## Build\nlabs/l10-documind/\n1. src/ingest.py — walk corpus/, chunk (per snippet; flags for size/overlap),\n   embed with basic retry/backoff, put_vectors with metadata\n   {source, heading, text}\n2. src/query.py — pipeline per snippet + structured JSON logs\n   (question, chunk sources, token usage) to CloudWatch\n3. src/api.py — HTTP API handler; CORS for the chat page\n4. web/chat.html — minimal: question box, streaming-style render (fine to\n   fake with chunked fetch), citations as expandable footnotes\n5. eval/golden.jsonl (10 Q + expected source files) + eval/run.py printing\n   retrieval hit-rate and a faithfulness spot-check prompt\n6. guardrail.sh (create/update via aws bedrock), infra.sh, destroy.sh\n7. README: tuning journal table (params -> hit-rate -> notes)\n\n## Acceptance checklist\n[ ] hit-rate >= 8/10 on golden set after tuning\n[ ] guardrail demonstrably blocks the denied topic + masks seeded PII\n[ ] cost per 100 questions computed from real token metrics\n[ ] destroy.sh clean (vector bucket, api, lambdas, guardrail)\n\n## Revision contract (2026-09-07)\nFollow the v2.1 corrections and prerequisite notes in every tab. Snippets are excerpts, not a deployed repository. Before deployment, produce and review the complete application/IaC, artifact manifest, narrowly scoped IAM, failure tests, and version-aware teardown. Do not claim a test passed unless it ran in the selected mode. Keep a retained-resource ledger with cost/expiry. Synthetic data only.\n",

const LAB_STATUS = {
  not_started:'Not started', building:'Building', deployed:'Deployed',
  chaos_tested:'Chaos-tested', destroyed:'Destroyed', revised:'Revised'
};
const EVIDENCE_ITEMS = [
  'Architecture decision record: requirements, constraints, chosen option and rejected alternatives',
  'Working deployment plus automated or repeatable verification',
  'Failure-injection evidence with measured recovery behaviour',
  'CloudWatch, trace, log or configuration evidence exported before teardown',
  'Actual cost recorded and compared with the estimate',
  'Teardown completed and audit script reports no unintended billable resources',
  'Two-minute Feynman explanation recorded or delivered without notes'
];
function validateProgress(value){
  if(!value||value.version!==1||!value.labs||typeof value.labs!=='object'||Array.isArray(value.labs))throw Error('Invalid progress file');
  const valid=new Set(APPS.map(a=>a.id)), out={};
  for(const [id,s] of Object.entries(value.labs)){
    if(!valid.has(id)||!s||typeof s!=='object'||Array.isArray(s))throw Error('Unknown lab or invalid record');
    const status=s.status===undefined?'not_started':s.status, actual=s.actual===undefined?0:s.actual;
    if(!Object.hasOwn(LAB_STATUS,status)||typeof actual!=='number'||!Number.isFinite(actual)||actual<0)throw Error('Invalid status or cost');
    const ev=s.evidence===undefined?{}:s.evidence;
    if(!ev||typeof ev!=='object'||Array.isArray(ev))throw Error('Invalid evidence');
    for(const [k,v]of Object.entries(ev))if(!/^[0-6]$/.test(k)||typeof v!=='boolean')throw Error('Invalid evidence entry');
    out[id]={status,actual,evidence:{...ev}};
  }
  return out;
}
function exportProgress(){
  const labs=validateProgress({version:1,labs:Object.fromEntries(APPS.map(a=>[a.id,getState(a.id)]))});
  const url=URL.createObjectURL(new Blob([JSON.stringify({version:1,labs},null,2)],{type:'application/json'}));
  const a=document.createElement('a');a.href=url;a.download='saa-lab-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function importProgress(input){
  const file=input.files&&input.files[0];if(!file)return;
  try{
    if(file.size>100000)throw Error('Progress file is too large');
    const labs=validateProgress(JSON.parse(await file.text()));
    if(!confirm('Replace progress for the labs present in this file? Export your current progress first.'))return;
    for(const [id,s]of Object.entries(labs))localStorage.setItem(stateKey(id),JSON.stringify(s));
    route();
  }catch(err){alert('Import failed: '+err.message);}finally{input.value='';}
}
function printAllLabs(){
  const main=document.getElementById('main');
  main.innerHTML=overview()+APPS.map(labView).join('');
  main.querySelectorAll('.codeblk').forEach(b=>b.querySelector('pre').textContent=b.querySelector('template').content.textContent);
  main.querySelectorAll('details').forEach(x=>x.open=true);
  window.addEventListener('afterprint',()=>route(),{once:true});
  window.print();
}

function labTrack(app){return ['l9','l10','l11'].includes(app.id)?'ai':'core';}
function stateKey(id){return `saa-v2:${id}`;}
function getState(id){try{return JSON.parse(localStorage.getItem(stateKey(id)))||{};}catch{return {};}}
function saveState(id,patch){const s={...getState(id),...patch};localStorage.setItem(stateKey(id),JSON.stringify(s));updateSidebarProgress();}
function setLabStatus(id,v){saveState(id,{status:v});route();}
function setActualCost(id,v){saveState(id,{actual:Math.max(0,Number(v)||0)});updateSidebarProgress();}
function toggleEvidence(id,i,v){const s=getState(id), ev=s.evidence||{};ev[i]=v;saveState(id,{evidence:ev});const p=document.getElementById(`evidence-progress-${id}`);if(p){const done=Object.values(ev).filter(Boolean).length;p.style.width=(done/EVIDENCE_ITEMS.length*100)+'%';}}
function totalActual(){return APPS.reduce((n,a)=>n+(Number(getState(a.id).actual)||0),0);}
function completedEvidence(app){const ev=getState(app.id).evidence||{};return Object.values(ev).filter(Boolean).length;}
function examPrompts(app){
  const svc=app.services.slice(0,4).join(', ');
  return [
    `A company has the same business problem as this lab but requires stricter availability. Which part of the architecture changes first, and why?`,
    `Explain why ${app.services[0]} was selected here and identify the closest plausible AWS alternative. What requirement would make the alternative correct?`,
    `A failure occurs in the most stateful component. Describe detection, automatic recovery, RTO/RPO and what still requires application design.`,
    `Reduce the idle cost by at least 30% without violating the stated requirements. Name the trade-offs, not only the cheaper service.`,
    `Identify one identity, network and data-protection control. Which is preventive, detective or responsive?`,
    `Using ${svc}, design one deliberately wrong answer option and explain the exam keyword that exposes it as wrong.`,
    `What metric, log or trace proves this design is behaving correctly? State the threshold or measurement you would record.`,
    `Explain the complete architecture in two minutes without naming a service until after you have described the requirement it satisfies.`
  ];
}
function statusOptions(selected){return Object.entries(LAB_STATUS).map(([k,v])=>`<option value="${k}" ${k===(selected||'not_started')?'selected':''}>${v}</option>`).join('');}
function updateSidebarProgress(){
  const total=APPS.length*EVIDENCE_ITEMS.length, done=APPS.reduce((n,a)=>n+completedEvidence(a),0);
  const el=document.getElementById('ledgerBuffer');
  if(el) el.textContent=money(PROGRAMME.credit-totalActual())+' allocation less recorded spend (not live credit)';
}
function filterOverview(){
  const q=(document.getElementById('labSearch')?.value||'').toLowerCase();
  const track=document.getElementById('trackFilter')?.value||'all';
  const status=document.getElementById('statusFilter')?.value||'all';
  document.querySelectorAll('#labTable tbody tr').forEach(r=>{
    const okq=!q||r.dataset.search.includes(q), okt=track==='all'||r.dataset.track===track, oks=status==='all'||r.dataset.status===status;

const TYPECOL={user:'#8B93A7',edge:'#A185E0',compute:'#E8913A',db:'#5B9BE6',storage:'#5BBE7E',integration:'#D87BA4',security:'#E06257',ops:'#9AA6BD',ai:'#3DC6B6',analytics:'#CFA63B',cost:'#CFA63B'};

function diagramSVG(app){
  const d=app.diagram, NW=150, NH=52;
  const ctr=n=>({x:n.x+NW/2,y:n.y+NH/2});
  let s=`<svg viewBox="0 0 ${d.w} ${d.h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Architecture diagram for ${esc(app.name)}">`;
  s+=`<defs><marker id="ar${app.id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5E687C"/></marker></defs>`;
  (d.zones||[]).forEach(z=>{s+=`<rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="8" fill="none" stroke="#536079" stroke-dasharray="6 4"/><text x="${z.x+10}" y="${z.y+18}" fill="#AAB7D0" font-family="sans-serif" font-size="12">${esc(z.label)}</text>`;});
  const byId={}; d.nodes.forEach(n=>byId[n.id]=n);
  d.edges.forEach(e=>{
    const a=ctr(byId[e.f]),b=ctr(byId[e.t]);
    const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len;
    const trim=(p,u,k)=>({x:p.x+u.x*k,y:p.y+u.y*k});
    const sx=Math.min(Math.abs(ux)>1e-9?NW/2/Math.abs(ux):Infinity,Math.abs(uy)>1e-9?NH/2/Math.abs(uy):Infinity)+4;
    const p1=trim(a,{x:ux,y:uy},sx), p2=trim(b,{x:-ux,y:-uy},sx);
    s+=`<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="#5E687C" stroke-width="1.4" ${e.d?'stroke-dasharray="5 5" opacity=".65"':''} marker-end="url(#ar${app.id})"/>`;
    if(e.l){const mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2;
      s+=`<text x="${mx}" y="${my-6}" text-anchor="middle" font-family="IBM Plex Mono" font-size="10" fill="#8C96AB" paint-order="stroke" stroke="#0C0F16" stroke-width="4">${esc(e.l)}</text>`;}
  });
  d.nodes.forEach((n,i)=>{
    const c=TYPECOL[n.t]||'#888';
    s+=`<g class="nd" data-i="${i}" tabindex="0" role="button" aria-label="${esc(n.label)} — tap for exam notes">`;
    s+=`<rect x="${n.x}" y="${n.y}" width="${NW}" height="${NH}" rx="9" fill="#161B27" stroke="${c}" stroke-width="1.3"/>`;
    s+=`<rect x="${n.x}" y="${n.y}" width="4" height="${NH}" rx="2" fill="${c}"/>`;
    s+=`<text x="${n.x+14}" y="${n.y+21}" font-family="IBM Plex Sans" font-weight="600" font-size="12.5" fill="#D9E0EE">${esc(n.label)}</text>`;
    s+=`<text x="${n.x+14}" y="${n.y+38}" font-family="IBM Plex Mono" font-size="9.5" fill="#8C96AB">${esc(n.sub||'')}</text></g>`;
  });
  return s+'</svg>';
}

function codeBlock(t,c){return `<div class="codeblk"><div class="hd"><span>${esc(t)}</span><button onclick="copyCode(this)">copy</button></div><pre></pre><template>${esc(c)}</template></div>`;}

function overview(){
  const total=APPS.reduce((s,a)=>s+a.cost,0), actual=totalActual();
  const evidenceDone=APPS.reduce((n,a)=>n+completedEvidence(a),0), evidenceTotal=APPS.length*EVIDENCE_ITEMS.length;
  const rows=APPS.map(a=>{
    const dots=[1,2,3,4].map(d=>`<td style="text-align:center"><span class="dot" style="background:${(a.dchips||[]).includes(d)?{1:'#E06257',2:'#5BBE7E',3:'#5B9BE6',4:'#CFA63B'}[d]:'var(--line)'}"></span></td>`).join('');
    const w=Math.max(2,a.cost/total*100), st=getState(a.id), track=labTrack(a), status=st.status||'not_started';
    const search=esc((a.name+' '+a.domain+' '+a.services.join(' ')).toLowerCase());
    return `<tr data-search="${search}" data-track="${track}" data-status="${status}" style="cursor:pointer" onclick="location.hash='${a.id}'"><td class="m" style="color:var(--amber)">${a.num}</td><td><b>${esc(a.name.split(' — ')[0])}</b><br><span style="font-size:11.5px;color:var(--mut)">${esc(a.name.split(' — ')[1]||'')}</span></td><td><span class="track ${track}">${track==='core'?'core':'AI'}</span></td>${dots}<td><span class="statuspill">${LAB_STATUS[status]}</span><br><span style="font-size:10px;color:var(--mut)">${completedEvidence(a)}/${EVIDENCE_ITEMS.length} evidence</span></td><td class="m" style="white-space:nowrap">${money(a.cost)} / ${money(Number(st.actual)||0)}<div style="height:5px;border-radius:3px;background:linear-gradient(90deg,var(--amber),var(--gold));width:${w*1.6}px;max-width:120px;margin-top:4px"></div></td></tr>`;
  }).join('');
  const sources=PROGRAMME_SOURCES.map(([n,u])=>`<li><a href="${u}" target="_blank" rel="noopener">${n}</a></li>`).join('');
  return `<div class="crumb">Field manual v${PROGRAMME.version} · ${PROGRAMME.examCoreCount} SAA core modules + ${PROGRAMME.aiExtensionCount} AI extensions · content reviewed ${PROGRAMME.lastVerified}</div>
  <h1 class="title">The $170 Cloud · v2.1</h1>
  <p class="tagline">A practical SAA-C03 architecture programme with a deliberate <b>$100 soft spending limit</b> inside your $170 credit. The unused $70 is a safety reserve, not a target. Every lab follows the same loop: <b>design → deploy via short-lived credentials → break deliberately → measure → preserve evidence → destroy → verify the bill</b>.</p>
  <div class="statrow">
    <div class="stat"><div class="v">${money(total)}</div><div class="l">planned burn</div></div>
    <div class="stat"><div class="v">${money(PROGRAMME.spendingCap-total)}</div><div class="l">cap headroom</div></div>
    <div class="stat"><div class="v">${money(actual)}</div><div class="l">actual recorded</div></div>
    <div class="stat"><div class="v">${evidenceDone}/${evidenceTotal}</div><div class="l">evidence completed</div></div>
  </div>
  <div class="note"><b>Programme boundary:</b> complete the 12-module SAA core before the three AI extensions. If you already hold AIF-C01, SageStart is optional; DocuMind and OpsPilot provide the stronger AI-engineering portfolio value. Check credit expiry, eligible services and account-plan restrictions in Billing before enabling Organizations, Control Tower or expensive managed capacity.</div>
  <div class="warn"><b>Current-cost reminder:</b> public IPv4 addresses are billable, including addresses attached to running resources and service-managed addresses. Audit ALB, NAT, EC2, RDS and other public IPv4 address-hours, not only unattached Elastic IPs.</div>
  <h2 class="sec">Lab index × exam domains</h2>
  <div class="v2bar">
    <div class="v2field grow"><label>Search service, lab or concept</label><input id="labSearch" oninput="filterOverview()" placeholder="e.g. KMS, Transit Gateway, DMS, Bedrock"></div>
    <div class="v2field"><label>Track</label><select id="trackFilter" onchange="filterOverview()"><option value="all">All</option><option value="core">SAA core</option><option value="ai">AI extension</option></select></div>
    <div class="v2field"><label>Status</label><select id="statusFilter" onchange="filterOverview()"><option value="all">All</option>${Object.entries(LAB_STATUS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
  </div><div class="filterhint">Progress is local to this browser. Export/import transfers only lab status, recorded cost and evidence ticks—not AWS credentials. These records are not a live credit balance.</div><div class="v2bar"><button onclick="exportProgress()">Export progress</button><label>Import progress <input type="file" accept="application/json,.json" onchange="importProgress(this)"></label><button onclick="printAllLabs()">Print all labs</button><a href="saa-c03-visual-handbook-2026.09.html">Companion handbook</a></div>
  <table class="tb" id="labTable"><thead><tr><th>#</th><th>Lab</th><th>Track</th><th style="text-align:center">D1<br>30%</th><th style="text-align:center">D2<br>26%</th><th style="text-align:center">D3<br>24%</th><th style="text-align:center">D4<br>20%</th><th>Status</th><th>Plan / actual</th></tr></thead><tbody>${rows}</tbody></table>
  <h2 class="sec">Recommended cadence</h2>
  <div class="grid2">
    <div class="card"><h4>Core phase 1 — Guardrails and canonical architectures</h4><p>Lab 00, ShelfLife and LinkForge. Establish identity, cost and delivery controls; then contrast server-based and serverless implementations of similar business requirements.</p></div>
    <div class="card"><h4>Core phase 2 — Decoupling, edge and containers</h4><p>OrderFlow, CraftRoast and FreshTrack. Practise asynchronous integration, global delivery, DNS, WAF, ECS, deployment strategies and both AWS-native and third-party IaC.</p></div>
    <div class="card"><h4>Core phase 3 — Data and resilience</h4><p>ClipPress, StreamSight and VaultGrade. Build storage pipelines, analytics paths and a measured multi-Region recovery drill with explicit RTO and RPO.</p></div>
    <div class="card"><h4>Core phase 4 — Security, networks and migration</h4><p>SecureLanding, HybridHub and DataShift close the highest-value gaps: policy evaluation, KMS, detection, multi-VPC/hybrid networking, database scaling, caching and migration services.</p></div>
    <div class="card"><h4>Optional AI extension</h4><p>SageStart, DocuMind and OpsPilot convert your AIF-C01 knowledge into managed-AI, RAG and agentic FinOps evidence. Always verify Bedrock model lifecycle, Regional availability and pricing before deployment.</p></div>
    <div class="card"><h4>Exam conversion</h4><p>Complete each evidence checklist and scenario drill. A lab is complete only after architecture decisions, failure evidence, actual cost and clean teardown have been recorded.</p></div>
  </div>
  <h2 class="sec">Golden rules</h2>
  <ol class="ls">
    <li><b>Use IAM Identity Center for human access.</b> Root is MFA-protected emergency access; CI and workloads use scoped roles and temporary credentials.</li>
    <li><b>One expensive lab alive at a time.</b> NAT gateways, load balancers, endpoints, databases, public IPv4 and managed capacity never pause just because you stop studying.</li>
    <li><b>Write destroy.sh before deploy.sh.</b> Add TTL tags and an evening audit workflow.</li>
    <li><b>Predict before clicking.</b> Write the expected policy result, route, failover or scaling behaviour before running the drill.</li>
    <li><b>Preserve evidence before teardown.</b> Export metrics, logs, screenshots and actual costs; never preserve a billable resource merely as evidence.</li>
    <li><b>Verify volatile facts.</b> Model IDs, service quotas, prices and Regional availability have a last-verified date and must be rechecked against official documentation.</li>
  </ol>
  <h2 class="sec">Official reference set</h2><div class="card sourcebox"><p class="muted">These are the primary sources used for v2's volatile claims. Service pricing remains Region- and date-dependent.</p><ul class="ls">${sources}</ul></div>
  ${navFooter('ov')}`;
}

/* ---------- router ---------- */
function buildNav(){
  const nav=document.getElementById('nav');
  let h=`<a class="it" data-id="ov" href="#ov"><span class="n">⌂</span>Overview & tracker</a>`;
  let current='';
  APPS.forEach(a=>{
    const tr=labTrack(a);if(tr!==current){h+=`<div class="navsec" style="padding-top:14px">${tr==='core'?'SAA core track':'AI extension'}</div>`;current=tr;}
    h+=`<a class="it" data-id="${a.id}" href="#${a.id}"><span class="n">${a.num}</span>${esc(a.name.split(' — ')[0])}<span class="c">${money(a.cost)}</span></a>`;
  });
  nav.innerHTML=h;
  const total=APPS.reduce((s,a)=>s+a.cost,0);
  document.getElementById('ledgerTotal').textContent=money(total)+' / '+money(PROGRAMME.spendingCap);
  document.getElementById('ledgerBar').style.width=(total/PROGRAMME.spendingCap*100).toFixed(0)+'%';
  updateSidebarProgress();
}

function route(){
  const id=(location.hash||'#ov').slice(1);
  const app=APPS.find(a=>a.id===id);
  const main=document.getElementById('main');
  main.innerHTML=app?labView(app):overview();
  document.querySelectorAll('.nav .it').forEach(el=>el.classList.toggle('on',el.dataset.id===(app?app.id:'ov')));
  // tabs
  main.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
    main.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    main.querySelectorAll('.pane').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    main.querySelector(`.pane[data-pane="${t.dataset.p}"]`).classList.add('on');
  }));
  // code blocks: move template text into pre
  main.querySelectorAll('.codeblk').forEach(b=>{b.querySelector('pre').textContent=b.querySelector('template').content.textContent;});
  // diagram lens
  if(app){
    const lens=document.getElementById('lens-'+app.id);
    const sel=g=>{
      main.querySelectorAll('.nd').forEach(x=>x.classList.remove('sel'));
      g.classList.add('sel');
      const n=app.diagram.nodes[+g.dataset.i];
      lens.innerHTML=`<span class="lk">${TYPENAME[n.t]} · exam lens</span><h4>${esc(n.label)} <span style="font-family:var(--mono);font-size:11px;color:var(--mut)">${esc(n.sub||'')}</span></h4><p>${n.n}</p>`;
    };
    main.querySelectorAll('.nd').forEach(g=>{g.addEventListener('click',()=>sel(g));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();sel(g);}});});
  }
  updateSidebarProgress();
  main.scrollIntoView?window.scrollTo({top:0}):0;
}
window.addEventListener('hashchange',route);
buildNav();route();
</script>
</body>

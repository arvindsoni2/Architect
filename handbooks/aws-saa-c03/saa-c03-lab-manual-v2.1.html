        "notes.md": "# OpsPilot — Agentic FinOps Copilot progress\nAccount:\nRegion: us-east-1\nLast passed step and observed evidence:\nARNs/IDs created:\nCurrent cost estimate:\nNext step:\nResource disposal (deleted / retained + cost + expiry / unexpected):\n",
        ".gitignore": "lab.env\n.venv/\n__pycache__/\ndist/\n",
        "tools.py": "\"\"\"One read-only Lambda for three operations in one Bedrock action group.\"\"\"\nimport datetime as dt\nimport json\nimport re\nimport time\nimport boto3\n_cache={}\ndef cost():\n    now=time.monotonic()\n    if 'cost' in _cache and now-_cache['cost'][0]<900:\n        return _cache['cost'][1]\n    today=dt.datetime.now(dt.timezone.utc).date()\n    start=today-dt.timedelta(days=7)\n    data=boto3.client('ce',region_name='us-east-1').get_cost_and_usage(\n        TimePeriod={'Start':start.isoformat(),'End':today.isoformat()},\n        Granularity='DAILY',Metrics=['UnblendedCost'],GroupBy=[\n          {'Type':'DIMENSION','Key':'SERVICE'}])\n    result={'from':start.isoformat(),'end_exclusive':today.isoformat(),\n            'days':data['ResultsByTime'],\n            'notice':'Billing data can lag and may be estimated; excludes today.'}\n    _cache['cost']=(now,result)\n    return result\ndef inventory():\n    region='us-east-1'\n    ec2=boto3.client('ec2',region_name=region)\n    instances=[]\n    for page in ec2.get_paginator('describe_instances').paginate(\n            Filters=[{'Name':'instance-state-name','Values':['running']}]):\n        for reservation in page['Reservations']:\n            instances.extend(x['InstanceId'] for x in reservation['Instances'])\n    nats=[]\n    for page in ec2.get_paginator('describe_nat_gateways').paginate():\n        nats.extend(x['NatGatewayId'] for x in page['NatGateways'] if x['State']!='deleted')\n    balancers=[]\n    for page in boto3.client('elbv2',region_name=region).get_paginator('describe_load_balancers').paginate():\n        balancers.extend(x['LoadBalancerArn'] for x in page['LoadBalancers'])\n    databases=[]\n    for page in boto3.client('rds',region_name=region).get_paginator('describe_db_instances').paginate():\n        databases.extend(x['DBInstanceIdentifier'] for x in page['DBInstances'])\n    ecs=boto3.client('ecs',region_name=region)\n    clusters=[]\n    for page in ecs.get_paginator('list_clusters').paginate():\n        clusters.extend(page['clusterArns'])\n    services=[]\n    for cluster in clusters:\n        for page in ecs.get_paginator('list_services').paginate(cluster=cluster):\n            services.extend(page['serviceArns'])\n    return {'region':region,'running_ec2':instances,'nat_gateways':nats,\n            'load_balancers':balancers,'rds_instances':databases,\n            'ecs_services':services,\n            'coverage':'Selected services in us-east-1 only; not a full cleanup audit. Hourly rates vary and are not computed here.'}\ndef metrics(instance_id):\n    if not re.fullmatch(r'i-[0-9a-f]{8,17}',instance_id):\n        raise ValueError('Provide a valid EC2 instance ID')\n    end=dt.datetime.now(dt.timezone.utc)\n    client=boto3.client('cloudwatch',region_name='us-east-1')\n    result={'instance_id':instance_id,'start':(end-dt.timedelta(hours=24)).isoformat(),\n            'end':end.isoformat(),'period_seconds':300}\n    for metric in ('CPUUtilization','NetworkIn'):\n        reply=client.get_metric_statistics(Namespace='AWS/EC2',MetricName=metric,\n            Dimensions=[{'Name':'InstanceId','Value':instance_id}],\n            StartTime=end-dt.timedelta(hours=24),EndTime=end,\n            Period=300,Statistics=['Average','Maximum'])\n        points=reply['Datapoints']\n        result[metric]={'average':sum(p['Average'] for p in points)/len(points) if points else None,\n                        'maximum':max((p['Maximum'] for p in points),default=None),\n                        'unit':reply.get('Label',metric),\n                        'sample_count':len(points)}\n    return result\ndef handler(event,context):\n    path=event.get('apiPath')\n    params={x['name']:x.get('value','') for x in event.get('parameters',[])}\n    try:\n        if path=='/cost':result=cost()\n        elif path=='/resources':result=inventory()\n        elif path=='/instance-metrics':result=metrics(params.get('instanceId',''))\n        else:raise ValueError('Unknown read-only operation')\n        status=200\n    except ValueError as exc:status=400;result={'error':str(exc)}\n    return {'messageVersion':'1.0','response':{\n        'actionGroup':event.get('actionGroup','finops'),\n        'apiPath':path or '', 'httpMethod':event.get('httpMethod','GET'),\n        'httpStatusCode':status,\n        'responseBody':{'application/json':{'body':json.dumps(result,default=str)}}}}\n",

e['Reservations']:\n            instances.extend(x['InstanceId'] for x in reservation['Instances'])\n    nats=[]\n    for page in ec2.get_paginator('describe_nat_gateways').paginate():\n        nats.extend(x['NatGatewayId'] for x in page['NatGateways'] if x['State']!='deleted')\n    balancers=[]\n    for page in boto3.client('elbv2',region_name=region).get_paginator('describe_load_balancers').paginate():\n        balancers.extend(x['LoadBalancerArn'] for x in page['LoadBalancers'])\n    databases=[]\n    for page in boto3.client('rds',region_name=region).get_paginator('describe_db_instances').paginate():\n        databases.extend(x['DBInstanceIdentifier'] for x in page['DBInstances'])\n    ecs=boto3.client('ecs',region_name=region)\n    clusters=[]\n    for page in ecs.get_paginator('list_clusters').paginate():\n        clusters.extend(page['clusterArns'])\n    services=[]\n    for cluster in clusters:\n        for page in ecs.get_paginator('list_services').paginate(cluster=cluster):\n            services.extend(page['serviceArns'])\n    return {'region':region,'running_ec2':instances,'nat_gateways':nats,\n            'load_balancers':balancers,'rds_instances':databases,\n            'ecs_services':services,\n            'coverage':'Selected services in us-east-1 only; not a full cleanup audit. Hourly rates vary and are not computed here.'}\ndef metrics(instance_id):\n    if not re.fullmatch(r'i-[0-9a-f]{8,17}',instance_id):\n        raise ValueError('Provide a valid EC2 instance ID')\n    end=dt.datetime.now(dt.timezone.utc)\n    client=boto3.client('cloudwatch',region_name='us-east-1')\n    result={'instance_id':instance_id,'start':(end-dt.timedelta(hours=24)).isoformat(),\n            'end':end.isoformat(),'period_seconds':300}\n    for metric in ('CPUUtilization','NetworkIn'):\n        reply=client.get_metric_statistics(Namespace='AWS/EC2',MetricName=metric,\n            Dimensions=[{'Name':'InstanceId','Value':instance_id}],\n            StartTime=end-dt.timedelta(hours=24),EndTime=end,\n            Period=300,Statistics=['Average','Maximum'])\n        points=reply['Datapoints']\n        result[metric]={'average':sum(p['Average'] for p in points)/len(points) if points else None,\n                        'maximum':max((p['Maximum'] for p in points),default=None),\n                        'unit':reply.get('Label',metric),\n                        'sample_count':len(points)}\n    return result\ndef handler(event,context):\n    path=event.get('apiPath')\n    params={x['name']:x.get('value','') for x in event.get('parameters',[])}\n    try:\n        if path=='/cost':result=cost()\n        elif path=='/resources':result=inventory()\n        elif path=='/instance-metrics':result=metrics(params.get('instanceId',''))\n        else:raise ValueError('Unknown read-only operation')\n        status=200\n    except ValueError as exc:status=400;result={'error':str(exc)}\n    return {'messageVersion':'1.0','response':{\n        'actionGroup':event.get('actionGroup','finops'),\n        'apiPath':path or '', 'httpMethod':event.get('httpMethod','GET'),\n        'httpStatusCode':status,\n        'responseBody':{'application/json':{'body':json.dumps(result,default=str)}}}}\nLAB_FILE_2\nprintf 'Created %s\\n' 'tools.py'\nmkdir -p -- '.'\ncat > 'finops.openapi.json' <<'LAB_FILE_3'\n{\n  \"openapi\": \"3.0.0\",\n  \"info\": {\n    \"title\": \"Read-only lab FinOps tools\",\n    \"version\": \"1.0.0\"\n  },\n  \"paths\": {\n    \"/cost\": {\n      \"get\": {\n        \"operationId\": \"getCostByService\",\n        \"description\": \"Read actual recorded cost by AWS service for the seven completed UTC days; never claim today's live cost or a final bill.\",\n        \"responses\": {\n          \"200\": {\n            \"description\": \"Cost Explorer time periods and estimated flags.\",\n            \"content\": {\n              \"application/json\": {\n                \"schema\": {\n                  \"type\": \"object\",\n                  \"properties\": {\n                    \"from\": {\n                      \"type\": \"string\",\n                      \"description\": \"First completed UTC date\"\n                    },\n                    \"end_exclusive\": {\n                      \"type\": \"string\",\n                      \"description\": \"Exclusive UTC end date; today is not yet complete\"\n                    },\n                    \"days\": {\n                      \"type\": \"array\",\n                      \"description\": \"Cost Explorer daily groups with Estimated flags\",\n                      \"items\": {\n                        \"type\": \"object\"\n                      }\n                    }\n                  }\n                }\n              }\n            }\n          }\n        }\n      }\n    },\n    \"/resources\": {\n      \"get\": {\n        \"operationId\": \"listRunningResources\",\n        \"description\": \"List selected running EC2, NAT, ELB, RDS and ECS resources in us-east-1 only; NOT proof that the whole account is empty.\",\n        \"responses\": {\n          \"200\": {\n            \"description\": \"Selected resource IDs and explicit limited coverage.\",\n            \"content\": {\n              \"application/json\": {\n                \"schema\": {\n                  \"type\": \"object\",\n                  \"properties\": {\n                    \"region\": {\n                      \"type\": \"string\",\n                      \"description\": \"Region covered\"\n                    },\n                    \"running_ec2\": {\n                      \"type\": \"array\",\n                      \"description\": \"Running EC2 identifiers\",\n                      \"items\": {\n                        \"type\": \"string\"\n                      }\n                    },\n                    \"nat_gateways\": {\n                      \"type\": \"array\",\n                      \"description\": \"NAT identifiers\",\n                      \"items\": {\n ma\": {\n                  \"type\": \"object\",\n                  \"properties\": {\n                    \"instance_id\": {\n                      \"type\": \"string\",\n                      \"description\": \"Queried instance\"\n                    },\n                    \"start\": {\n                      \"type\": \"string\",\n                      \"description\": \"UTC start\"\n                    },\n                    \"end\": {\n                      \"type\": \"string\",\n                      \"description\": \"UTC end\"\n                    },\n                    \"CPUUtilization\": {\n                      \"type\": \"object\",\n                      \"description\": \"24h CPU samples\",\n                      \"properties\": {\n                        \"average\": {\n                          \"type\": \"number\"\n                        },\n                        \"maximum\": {\n                          \"type\": \"number\"\n                        }\n                      }\n                    },\n                    \"NetworkIn\": {\n                      \"type\": \"object\",\n                      \"description\": \"24h network samples\",\n                      \"properties\": {\n                        \"average\": {\n                          \"type\": \"number\"\n                        },\n                        \"maximum\": {\n                          \"type\": \"number\"\n                        }\n                      }\n                    }\n                  }\n                }\n              }\n            }\n          }\n        }\n      }\n    }\n  }\n}\nLAB_FILE_3\nprintf 'Created %s\\n' 'finops.openapi.json'\nmkdir -p -- '.'\ncat > 'test-cost.json' <<'LAB_FILE_4'\n{\"messageVersion\":\"1.0\",\"actionGroup\":\"finops\",\"apiPath\":\"/cost\",\"httpMethod\":\"GET\"}\nLAB_FILE_4\nprintf 'Created %s\\n' 'test-cost.json'\nmkdir -p -- '.'\ncat > 'test-resources.json' <<'LAB_FILE_5'\n{\"messageVersion\":\"1.0\",\"actionGroup\":\"finops\",\"apiPath\":\"/resources\",\"httpMethod\":\"GET\"}\nLAB_FILE_5\nprintf 'Created %s\\n' 'test-resources.json'\nmkdir -p -- '.'\ncat > 'test-metrics.json' <<'LAB_FILE_6'\n{\"messageVersion\":\"1.0\",\"actionGroup\":\"finops\",\"apiPath\":\"/instance-metrics\",\"httpMethod\":\"GET\",\"parameters\":[{\"name\":\"instanceId\",\"type\":\"string\",\"value\":\"i-0123456789abcdef0\"}]}\nLAB_FILE_6\nprintf 'Created %s\\n' 'test-metrics.json'\nmkdir -p -- '.'\ncat > 'opspilot.py' <<'LAB_FILE_7'\nimport argparse\nimport sys\nimport uuid\nimport boto3\np=argparse.ArgumentParser()\np.add_argument('--agent-id',required=True)\np.add_argument('--alias-id',required=True)\np.add_argument('--trace',action='store_true')\na=p.parse_args()\nsession=str(uuid.uuid4())\nclient=boto3.client('bedrock-agent-runtime')\nprint('Type an account question, or quit; no credentials or personal data.')\nwhile True:\n    try:query=input('> ').strip()\n    except EOFError:break\n    if query.lower() in ('quit','exit'):break\n    if not query:continue\n    response=client.invoke_agent(agentId=a.agent_id,agentAliasId=a.alias_id,\n        sessionId=session,inputText=query,enableTrace=a.trace)\n    for event in response['completion']:\n        if 'chunk' in event:print(event['chunk']['bytes'].decode('utf-8'),end='',flush=True)\n        if a.trace and 'trace' in event:print('\\nTRACE:',event['trace'],file=sys.stderr)\n    print()\nLAB_FILE_7\nprintf 'Created %s\\n' 'opspilot.py'\nLAB_STARTER\n",

/* ============================ engine ============================ */
const LAB_STATUS = {
  not_started:'Not started', building:'Building', deployed:'Deployed',
  chaos_tested:'Chaos-tested', destroyed:'Destroyed', revised:'Revised'
};
const EVIDENCE_ITEMS = [
  'Architecture decision record: requirements, constraints, chosen option and rejected alternatives',
  'Working deployment plus automated or repeatable verification',
  'Failure-injection evidence with measured recovery behaviour',
  'CloudWatch, trace, log or configuration evidence exported before teardown',
  'Actual cost recorded and compared with the estimate',
  'Teardown completed and audit script reports no unintended billable resources',
  'Two-minute Feynman explanation recorded or delivered without notes'
];
function validateProgress(value){
  if(!value||value.version!==1||!value.labs||typeof value.labs!=='object'||Array.isArray(value.labs))throw Error('Invalid progress file');
  const valid=new Set(APPS.map(a=>a.id)), out={};
  for(const [id,s] of Object.entries(value.labs)){
    if(!valid.has(id)||!s||typeof s!=='object'||Array.isArray(s))throw Error('Unknown lab or invalid record');
    const status=s.status===undefined?'not_started':s.status, actual=s.actual===undefined?0:s.actual;
    if(!Object.hasOwn(LAB_STATUS,status)||typeof actual!=='number'||!Number.isFinite(actual)||actual<0)throw Error('Invalid status or cost');
    const ev=s.evidence===undefined?{}:s.evidence;
    if(!ev||typeof ev!=='object'||Array.isArray(ev))throw Error('Invalid evidence');
    for(const [k,v]of Object.entries(ev))if(!/^[0-6]$/.test(k)||typeof v!=='boolean')throw Error('Invalid evidence entry');
    out[id]={status,actual,evidence:{...ev}};
  }
  return out;
}
function exportProgress(){
  const labs=validateProgress({version:1,labs:Object.fromEntries(APPS.map(a=>[a.id,getState(a.id)]))});
  const url=URL.createObjectURL(new Blob([JSON.stringify({version:1,labs},null,2)],{type:'application/json'}));
  const a=document.createElement('a');a.href=url;a.download='saa-lab-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function importProgress(input){
  const file=input.files&&input.files[0];if(!file)return;
  try{
    if(file.size>100000)throw Error('Progress file is too large');
    const labs=validateProgress(JSON.parse(await file.text()));
    if(!confirm('Replace progress for the labs present in this file? Export your current progress first.'))return;
    for(const [id,s]of Object.entries(labs))localStorage.setItem(stateKey(id),JSON.stringify(s));
    route();
  }catch(err){alert('Import failed: '+err.message);}finally{input.value='';}
}
function printAllLabs(){
  const main=document.getElementById('main');
  main.innerHTML=overview()+APPS.map(labView).join('');
  main.querySelectorAll('.codeblk').forEach(b=>b.querySelector('pre').textContent=b.querySelector('template').content.textContent);
  main.querySelectorAll('details').forEach(x=>x.open=true);
  window.addEventListener('afterprint',()=>route(),{once:true});
  window.print();
}

function labTrack(app){return ['l9','l10','l11'].includes(app.id)?'ai':'core';}
function stateKey(id){return `saa-v2:${id}`;}
function getState(id){try{return JSON.parse(localStorage.getItem(stateKey(id)))||{};}catch{return {};}}
function saveState(id,patch){const s={...getState(id),...patch};localStorage.setItem(stateKey(id),JSON.stringify(s));updateSidebarProgress();}
function setLabStatus(id,v){saveState(id,{status:v});route();}
function setActualCost(id,v){saveState(id,{actual:Math.max(0,Number(v)||0)});updateSidebarProgress();}
function toggleEvidence(id,i,v){const s=getState(id), ev=s.evidence||{};ev[i]=v;saveState(id,{evidence:ev});const p=document.getElementById(`evidence-progress-${id}`);if(p){const done=Object.values(ev).filter(Boolean).length;p.style.width=(done/EVIDENCE_ITEMS.length*100)+'%';}}
function totalActual(){return APPS.reduce((n,a)=>n+(Number(getState(a.id).actual)||0),0);}
function completedEvidence(app){const ev=getState(app.id).evidence||{};return Object.values(ev).filter(Boolean).length;}
function examPrompts(app){
  const svc=app.services.slice(0,4).join(', ');
  return [
    `A company has the same business problem as this lab but requires stricter availability. Which part of the architecture changes first, and why?`,
    `Explain why ${app.services[0]} was selected here and identify the closest plausible AWS alternative. What requirement would make the alternative correct?`,
    `A failure occurs in the most stateful component. Describe detection, automatic recovery, RTO/RPO and what still requires application design.`,
    `Reduce the idle cost by at least 30% without violating the stated requirements. Name the trade-offs, not only the cheaper service.`,
    `Identify one identity, network and data-protection control. Which is preventive, detective or responsive?`,
    `Using ${svc}, design one deliberately wrong answer option and explain the exam keyword that exposes it as wrong.`,
    `What metric, log or trace proves this design is behaving correctly? State the threshold or measurement you would record.`,
    `Explain the complete architecture in two minutes without naming a service until after you have described the requirement it satisfies.`
  ];
}
function statusOptions(selected){return Object.entries(LAB_STATUS).map(([k,v])=>`<option value="${k}" ${k===(selected||'not_started')?'selected':''}>${v}</option>`).join('');}
function updateSidebarProgress(){
  const total=APPS.length*EVIDENCE_ITEMS.length, done=APPS.reduce((n,a)=>n+completedEvidence(a),0);
  const el=document.getElementById('ledgerBuffer');

function diagramSVG(app){
  const d=app.diagram, NW=150, NH=52;
  const ctr=n=>({x:n.x+NW/2,y:n.y+NH/2});
  const intersects=(a,b)=>!(a.x+a.w<=b.x||b.x+b.w<=a.x||a.y+a.h<=b.y||b.y+b.h<=a.y);
  const placedLabels=[];
  const labelPenalty=box=>{
    let score=0;
    if(box.x<4)score+=(4-box.x)*100;
    if(box.y<4)score+=(4-box.y)*100;
    if(box.x+box.w>d.w-4)score+=(box.x+box.w-d.w+4)*100;
    if(box.y+box.h>d.h-4)score+=(box.y+box.h-d.h+4)*100;
    d.nodes.forEach(n=>{if(intersects(box,{x:n.x,y:n.y,w:NW,h:NH}))score+=10000;});
    placedLabels.forEach(label=>{if(intersects(box,label))score+=5000;});
    return score;
  };
  let s=`<svg viewBox="0 0 ${d.w} ${d.h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Architecture diagram for ${esc(app.name)}">`;
  s+=`<defs><marker id="ar${app.id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--diagram-line)"/></marker></defs>`;
  (d.zones||[]).forEach(z=>{s+=`<rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="8" fill="none" stroke="var(--diagram-zone)" stroke-dasharray="6 4"/><text x="${z.x+10}" y="${z.y+18}" fill="var(--diagram-zone-text)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">${esc(z.label)}</text>`;});
  const byId={}; d.nodes.forEach(n=>byId[n.id]=n);
  d.edges.forEach(e=>{
    const a=ctr(byId[e.f]),b=ctr(byId[e.t]);
    const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len;
    const trim=(p,u,k)=>({x:p.x+u.x*k,y:p.y+u.y*k});
    const sx=Math.min(Math.abs(ux)>1e-9?NW/2/Math.abs(ux):Infinity,Math.abs(uy)>1e-9?NH/2/Math.abs(uy):Infinity)+4;
    const p1=trim(a,{x:ux,y:uy},sx), p2=trim(b,{x:-ux,y:-uy},sx);
    s+=`<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="var(--diagram-line)" stroke-width="1.6" ${e.d?'stroke-dasharray="5 5" opacity=".78"':''} marker-end="url(#ar${app.id})"/>`;
    if(e.l){
      const labelWidth=Math.min(176,Math.max(42,String(e.l).length*6+16)),labelHeight=20;
      const nx=-uy,ny=ux;
      const labelProjection=Math.abs(nx)*labelWidth/2+Math.abs(ny)*labelHeight/2;
      const nodeProjection=Math.abs(nx)*NW/2+Math.abs(ny)*NH/2;
      const clearances=[labelProjection+7,nodeProjection+labelProjection+7,nodeProjection+labelProjection+27];
      const candidates=[];
      [0.5,0.36,0.64,0.22,0.78].forEach(t=>[-1,1].forEach(side=>clearances.forEach(clearance=>{
        const mx=p1.x+(p2.x-p1.x)*t,my=p1.y+(p2.y-p1.y)*t;
        const cx=mx+nx*clearance*side,cy=my+ny*clearance*side;
        const box={x:cx-labelWidth/2,y:cy-labelHeight/2,w:labelWidth,h:labelHeight,cx,cy};
        candidates.push({...box,score:labelPenalty(box)});
      })));
      const explicit=Number.isFinite(e.lx)&&Number.isFinite(e.ly)?{x:e.lx-labelWidth/2,y:e.ly-labelHeight/2,w:labelWidth,h:labelHeight,cx:e.lx,cy:e.ly}:null;
      const label=explicit&&labelPenalty(explicit)===0?explicit:candidates.sort((a,b)=>a.score-b.score)[0];
      placedLabels.push(label);
      s+=`<g class="edge-label" data-x="${label.x}" data-y="${label.y}" data-width="${label.w}" data-height="${label.h}"><rect x="${label.x}" y="${label.y}" width="${label.w}" height="${label.h}" rx="7" fill="var(--diagram-label)" stroke="var(--line2)"/><text x="${label.cx}" y="${label.cy+3.5}" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="10" fill="var(--diagram-muted)">${esc(e.l)}</text></g>`;
    }
  });
  d.nodes.forEach((n,i)=>{
    const c=TYPECOL[n.t]||'#888';
    s+=`<g class="nd" data-i="${i}" tabindex="0" role="button" aria-label="${esc(n.label)} — tap for exam notes">`;
    s+=`<rect x="${n.x}" y="${n.y}" width="${NW}" height="${NH}" rx="9" fill="var(--diagram-node)" stroke="${c}" stroke-width="1.5"/>`;
    s+=`<rect x="${n.x}" y="${n.y}" width="4" height="${NH}" rx="2" fill="${c}"/>`;
    s+=`<text x="${n.x+14}" y="${n.y+21}" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-weight="700" font-size="12.5" fill="var(--diagram-text)">${esc(n.label)}</text>`;
    s+=`<text x="${n.x+14}" y="${n.y+38}" font-family="SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="9.5" fill="var(--diagram-muted)">${esc(n.sub||'')}</text></g>`;
  });
  return s+'</svg>';
}

    <li><b>Write destroy.sh before deploy.sh.</b> Add TTL tags and an evening audit workflow.</li>
    <li><b>Predict before clicking.</b> Write the expected policy result, route, failover or scaling behaviour before running the drill.</li>
    <li><b>Preserve evidence before teardown.</b> Export metrics, logs, screenshots and actual costs; never preserve a billable resource merely as evidence.</li>
    <li><b>Verify volatile facts.</b> Model IDs, service quotas, prices and Regional availability have a last-verified date and must be rechecked against official documentation.</li>
  </ol>
  <h2 class="sec">Official reference set</h2><div class="card sourcebox"><p class="muted">These are the primary sources used for v2's volatile claims. Service pricing remains Region- and date-dependent.</p><ul class="ls">${sources}</ul></div>
  ${navFooter('ov')}`;
}

/* ---------- router ---------- */
function buildNav(){
  const nav=document.getElementById('nav');
  let h=`<a class="it" data-id="ov" href="#ov"><span class="n">⌂</span>Overview & tracker</a>`;
  let current='';
  APPS.forEach(a=>{
    const tr=labTrack(a);if(tr!==current){h+=`<div class="navsec" style="padding-top:14px">${tr==='core'?'SAA core track':'AI extension'}</div>`;current=tr;}
    h+=`<a class="it" data-id="${a.id}" href="#${a.id}"><span class="n">${a.num}</span>${esc(a.name.split(' — ')[0])}<span class="c">${money(a.cost)}</span></a>`;
  });
  nav.innerHTML=h;
  const total=APPS.reduce((s,a)=>s+a.cost,0);
  document.getElementById('ledgerTotal').textContent=money(total)+' / '+money(PROGRAMME.spendingCap);
  document.getElementById('ledgerBar').style.width=(total/PROGRAMME.spendingCap*100).toFixed(0)+'%';
  updateSidebarProgress();
}

function route(){
  const id=(location.hash||'#ov').slice(1);
  const app=APPS.find(a=>a.id===id);
  const main=document.getElementById('main');
  main.innerHTML=app?labView(app):overview();
  document.querySelectorAll('.nav .it').forEach(el=>el.classList.toggle('on',el.dataset.id===(app?app.id:'ov')));
  // tabs
  main.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
    main.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    main.querySelectorAll('.pane').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    main.querySelector(`.pane[data-pane="${t.dataset.p}"]`).classList.add('on');
  }));
  // code blocks: move template text into pre
  main.querySelectorAll('.codeblk').forEach(b=>{b.querySelector('pre').textContent=b.querySelector('template').content.textContent;});
  // diagram lens
  if(app){
    const lens=document.getElementById('lens-'+app.id);
    const sel=g=>{
      main.querySelectorAll('.nd').forEach(x=>x.classList.remove('sel'));
      g.classList.add('sel');
      const n=app.diagram.nodes[+g.dataset.i];
      lens.innerHTML=`<span class="lk">${TYPENAME[n.t]} · exam lens</span><h4>${esc(n.label)} <span style="font-family:var(--mono);font-size:11px;color:var(--mut)">${esc(n.sub||'')}</span></h4><p>${n.n}</p>`;
    };
    main.querySelectorAll('.nd').forEach(g=>{g.addEventListener('click',()=>sel(g));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();sel(g);}});});
  }
  updateSidebarProgress();
  main.scrollIntoView?window.scrollTo({top:0}):0;
}
window.addEventListener('hashchange',route);
initTheme();buildNav();route();
</script>
</body>
</html>

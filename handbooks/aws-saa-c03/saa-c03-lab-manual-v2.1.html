:root{

*{box-sizing:border-box;margin:0;padding:0}

body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.62;-webkit-font-smoothing:antialiased}

.wrap{display:grid;grid-template-columns:288px 1fr;min-height:100vh}

.side::-webkit-scrollbar{width:8px}.side::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
.brand{padding:22px 20px 16px;border-bottom:1px solid var(--line)}
.brand .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--amber);text-transform:uppercase}
.brand h1{font-size:19px;font-weight:600;letter-spacing:-.01em;margin-top:4px}
.brand p{font-size:12px;color:var(--mut);margin-top:3px}
.ledger{padding:14px 20px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(232,145,58,.05),transparent)}
.ledger .row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;color:var(--mut)}
.ledger .row b{color:var(--ink);font-weight:600}
.ledger .bar{height:7px;background:var(--panel);border:1px solid var(--line);border-radius:4px;margin:8px 0 4px;overflow:hidden}
.ledger .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--gold));width:40%}
.ledger .sub{font-size:10.5px;color:var(--mut);font-family:var(--mono)}
.navsec{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);padding:18px 20px 6px}
.nav a.it{display:flex;align-items:center;gap:10px;padding:8px 20px;color:var(--mut);text-decoration:none;font-size:13.5px;border-left:2px solid transparent;cursor:pointer}
.nav a.it:hover{color:var(--ink);background:rgba(255,255,255,.025)}
.nav a.it.on{color:var(--ink);border-left-color:var(--amber);background:rgba(232,145,58,.07)}
.nav a.it .n{font-family:var(--mono);font-size:10.5px;color:var(--faint);width:26px;flex:none}
.nav a.it.on .n{color:var(--amber)}
.nav a.it .c{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--green)}
/* ---------- main ---------- */
.main{min-width:0;padding:34px 44px 90px;max-width:1120px}
.crumb{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.title{font-size:31px;font-weight:600;letter-spacing:-.015em;margin:6px 0 2px}
.tagline{color:var(--mut);font-size:15px;max-width:760px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 6px}
.chip{font-family:var(--mono);font-size:11px;padding:4px 10px;border:1px solid var(--line2);border-radius:20px;color:var(--mut)}
.chip.d1{border-color:rgba(224,98,87,.5);color:#EFA098}.chip.d2{border-color:rgba(91,190,126,.5);color:#8ED4A6}
.chip.d3{border-color:rgba(91,155,230,.5);color:#93BEF0}.chip.d4{border-color:rgba(207,166,59,.5);color:#E0C46E}
.chip.cost{border-color:rgba(232,145,58,.55);color:var(--amber2);font-weight:600}
/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:22px 0 26px;flex-wrap:wrap}
.tab{font-family:var(--mono);font-size:12px;letter-spacing:.04em;padding:9px 16px;color:var(--mut);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--amber2);border-bottom-color:var(--amber)}
.pane{display:none}.pane.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* content blocks */
h2.sec{font-size:13px;font-family:var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--amber);margin:30px 0 12px;display:flex;align-items:center;gap:12px}
h2.sec::after{content:'';flex:1;height:1px;background:var(--line)}
h3.sub{font-size:16px;font-weight:600;margin:20px 0 6px}
p.body{color:#B9C2D4;margin:8px 0;max-width:820px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:12px 0}
.card h4{font-size:14.5px;font-weight:600;margin-bottom:4px}
.card p,.card li{font-size:13.8px;color:#AEB8CC}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.note{border-left:3px solid var(--teal);background:rgba(61,198,182,.06);padding:12px 16px;border-radius:0 8px 8px 0;margin:14px 0;font-size:13.8px;color:#B9C2D4}
.warn{border-left:3px solid var(--red);background:rgba(224,98,87,.07);padding:12px 16px;border-radius:0 8px 8px 0;margin:14px 0;font-size:13.8px;color:#C9BDBB}
.warn b,.note b{color:var(--ink)}
ul.ls{padding-left:20px;margin:8px 0}ul.ls li{margin:5px 0;color:#AEB8CC;font-size:13.8px}
ol.ls{padding-left:22px;margin:8px 0}ol.ls li{margin:6px 0;color:#AEB8CC;font-size:13.8px}
b,strong{color:var(--ink);font-weight:600}
code.in{font-family:var(--mono);font-size:12.5px;background:var(--panel2);border:1px solid var(--line);padding:1px 6px;border-radius:5px;color:var(--amber2)}

.codeblk{position:relative;margin:14px 0}
.codeblk .hd{display:flex;justify-content:space-between;align-items:center;background:var(--panel2);border:1px solid var(--line);border-bottom:none;border-radius:9px 9px 0 0;padding:7px 14px;font-family:var(--mono);font-size:11px;color:var(--mut);letter-spacing:.06em}
.codeblk button{font-family:var(--mono);font-size:10.5px;background:none;border:1px solid var(--line2);color:var(--mut);border-radius:5px;padding:2px 9px;cursor:pointer}
.codeblk button:hover{color:var(--amber2);border-color:var(--amber)}
.codeblk pre{background:#0C0F16;border:1px solid var(--line);border-radius:0 0 9px 9px;padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:12.3px;line-height:1.6;color:#C5CEE0;white-space:pre}
/* diagram */
.dg{background:#0C0F16;border:1px solid var(--line);border-radius:12px;padding:10px;margin:14px 0 8px;overflow-x:auto}
.dg svg{display:block;width:100%;height:auto;min-width:640px}
.dg .nd{cursor:pointer}
.dg .nd rect{transition:filter .15s, stroke .15s}
.dg .nd:hover rect{filter:brightness(1.25)}
.dg .nd.sel rect{stroke:#fff;stroke-width:1.6}
.lens{border:1px solid var(--line2);border-radius:10px;background:var(--panel);padding:14px 18px;margin:6px 0 18px;min-height:54px}
.lens .lk{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
.lens h4{font-size:15px;margin:3px 0 4px}
.lens p{font-size:13.6px;color:#AEB8CC}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:8px 2px 4px;font-family:var(--mono);font-size:10.8px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
/* runbook */
.step{display:grid;grid-template-columns:44px 1fr;gap:14px;margin:16px 0;padding-bottom:16px;border-bottom:1px dashed var(--line)}
.step:last-child{border-bottom:none}
.step .pn{font-family:var(--mono);font-size:12px;color:var(--amber);background:var(--panel);border:1px solid var(--line2);border-radius:8px;height:34px;display:flex;align-items:center;justify-content:center;margin-top:2px}
.step h4{font-size:14.5px;font-weight:600}
.step .bd{font-size:13.7px;color:#AEB8CC;margin-top:3px}

table.tb{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.3px}
table.tb th{font-family:var(--mono);font-size:10.8px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);text-align:left;padding:8px 12px;border-bottom:1px solid var(--line2)}
table.tb td{padding:8px 12px;border-bottom:1px solid var(--line);color:#B9C2D4;vertical-align:top}
table.tb td.m{font-family:var(--mono);font-size:12px}
table.tb tr:hover td{background:rgba(255,255,255,.02)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%}

.handoff pre{max-height:560px;overflow-y:auto}
.kpill{display:inline-block;font-family:var(--mono);font-size:10.5px;color:var(--mut);border:1px solid var(--line);padding:2px 8px;border-radius:5px;margin:2px 4px 2px 0}
.hero{border:1px solid var(--line);border-radius:14px;padding:30px 32px;background:radial-gradient(1100px 420px at 18% -10%,rgba(232,145,58,.12),transparent 60%),var(--panel);margin:18px 0 8px}
.hero h2{font-size:24px;font-weight:600;letter-spacing:-.01em}
.hero p{color:#B9C2D4;max-width:780px;margin-top:8px}
.bignum{font-family:var(--mono);font-size:34px;color:var(--amber2);font-weight:600}
.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
@media(max-width:880px){.statrow{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat .v{font-family:var(--mono);font-size:22px;color:var(--ink);font-weight:600}
.stat .l{font-size:11.5px;color:var(--mut);font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}

footer{margin-top:60px;padding-top:18px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--faint)}
.v2bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:14px 0}

.v2field label,.v2label{font-family:var(--mono);font-size:9.8px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.v2field input,.v2field select{width:100%;background:#0C0F16;color:var(--ink);border:1px solid var(--line2);border-radius:7px;padding:7px 9px;font-family:var(--mono);font-size:11.5px}
.track{font-family:var(--mono);font-size:10.5px;padding:4px 9px;border-radius:16px;border:1px solid var(--line2)}
.track.core{color:#93BEF0;border-color:rgba(91,155,230,.5)}.track.ai{color:#77D8CB;border-color:rgba(61,198,182,.5)}
.statuspill{display:inline-block;font-family:var(--mono);font-size:10px;padding:3px 8px;border:1px solid var(--line2);border-radius:12px;color:var(--mut);white-space:nowrap}
.evidence{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
@media(max-width:800px){.evidence{grid-template-columns:1fr}}
.checkcard{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 12px;color:#B9C2D4;font-size:13.2px}
.checkcard input{margin-top:3px;accent-color:var(--amber)}
.qcard{counter-increment:q;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:13px 15px;margin:9px 0;color:#B9C2D4}
.qcard::before{content:'Q' counter(q);font-family:var(--mono);font-size:10px;color:var(--amber);margin-right:9px}
.qwrap{counter-reset:q}.sourcebox a{word-break:break-word}.muted{color:var(--mut)}
.progressbar{height:7px;background:#0C0F16;border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-top:7px}.progressbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--green))}
.filterhint{font-family:var(--mono);font-size:10.5px;color:var(--mut);margin-top:-7px;margin-bottom:8px}

:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:4px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print { aside,.sidebar,.tabs,.v2bar,button {display:none!important} main{margin:0!important;max-width:none!important} .pane{display:block!important} .dg{overflow:visible!important} svg{min-width:0!important;max-width:100%!important} .card,.step{break-inside:avoid} pre{white-space:pre-wrap!important} body{background:white!important;color:black!important} }
/* Scoped to the two Lab 1 pilot tabs. */
.lab1-pilot .step{grid-template-columns:44px minmax(0,1fr)}

.lab1-pilot ol,.lab1-pilot ul{padding-left:24px;margin:10px 0}
.lab1-pilot li{margin:7px 0}
.lab1-pilot table{width:100%;border-collapse:collapse;margin:16px 0;font-size:13px}
.lab1-pilot th,.lab1-pilot td{text-align:left;vertical-align:top;padding:10px;border:1px solid var(--line)}
.lab1-pilot th{background:var(--panel2);color:var(--ink)}
.lab1-pilot code{overflow-wrap:anywhere}
.lab1-pilot summary{cursor:pointer;font-weight:600;color:var(--amber2)}
.lab1-pilot .codeblk pre{max-height:480px;overflow:auto}
@media(max-width:640px){.lab1-pilot .step{grid-template-columns:30px minmax(0,1fr);gap:8px}.lab1-pilot table{display:block;overflow-x:auto}.lab1-pilot .card{padding:12px}}
@media print{.lab1-pilot .codeblk pre{max-height:none;overflow:visible}}
</style>
</head>

    "design": [
      {
        "h": "Cost ledger and teardown contract",
        "b": "Budgets include credits/refunds by default; this example excludes them to show gross usage. Reconcile monthly alerts with a lifetime programme ledger and actual eligible credit remaining. The on-page ledger is user-entered spend, not an AWS credit balance. Before deployment, implement an audit manifest listing every created ARN/ID, Region, resource type, owner tag and retention decision. Query service APIs, paginate, fail on access errors, and include EBS/snapshots/AMIs, EFS, Backup recovery points, KMS, S3 versions, DynamoDB, ECR, logs, endpoints, public IPv4 and security-service subscriptions. Report deleted / retained with cost and expiry / unexpected residual; never infer a clean account from an empty tag search. TTL tags alone do not delete anything. <a href=\"https://docs.aws.amazon.com/aws-cost-management/latest/APIReference/API_budgets_CostTypes.html\" target=\"_blank\" rel=\"noopener noreferrer\">Budget cost types</a> · <a href=\"https://docs.aws.amazon.com/cli/latest/reference/s3/rb.html\" target=\"_blank\" rel=\"noopener noreferrer\">Version-aware bucket removal</a>"
      },
      {
        "h": "Account and federation preflight",
        "b": "Check credit expiry, eligible services, and account-plan restrictions before changes. AWS account permission sets and CLI SSO require an Identity Center organization instance; a standalone account instance is for supported applications, not this account-access flow. Use existing authorized access or resolve this prerequisite before deploying. Match the actual GitHub OIDC subject, including environment and immutable IDs where applicable. <a href=\"https://docs.aws.amazon.com/singlesignon/latest/userguide/identity-center-instances.html\" target=\"_blank\" rel=\"noopener noreferrer\">Identity Center instances</a> · <a href=\"https://docs.github.com/en/actions/how-tos/secure-your-work/security-harden-deployments/oidc-in-aws\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub OIDC subjects</a>"
      },
      {
        "h": "Why a spine and not per-lab pipelines",
        "b": "You will deploy and destroy eleven apps. The thing that should persist is the <b>delivery mechanism</b>: one repo, one OIDC trust, one set of reusable workflows. Each lab is then a folder with its own <code class=\"in\">deploy.yml</code> that assumes the same role. This is exactly how platform teams structure delivery for many product squads — a strong interview narrative for a Delivery Lead."
      },
      {
        "h": "Identity model",
        "b": "Root user: MFA, then emergency use only. Daily work: IAM Identity Center with permission sets and <code class=\"in\">aws configure sso</code>. CI: short-lived OIDC roles, preferably one role per lab rather than a permanent administrator role. EC2/ECS/Lambda: instance, task and execution roles. Keep a break-glass IAM user only when justified, without access keys by default. <b>Humans federate, machines assume roles, nobody embeds keys.</b>"
      },
      {
        "h": "Cost control as architecture",
        "b": "Tag every resource <code class=\"in\">Project=saa-lab</code> and <code class=\"in\">Lab=L1..L11</code>, activate the tags as cost allocation tags, and Cost Explorer can show burn per lab. Teardown is a first-class artifact: every lab ships a <code class=\"in\">destroy.sh</code> you write before you deploy."
      }
    ],
    "concepts": [
      {
        "h": "IAM policy evaluation",
        "b": "Explicit deny &gt; explicit allow &gt; implicit deny. Identity-based vs resource-based policies (S3 bucket policies, SQS queue policies). Permissions boundaries cap what a role can ever do. SCPs (Organizations) cap whole accounts — they don't grant anything, they only filter."
      },
      {
        "h": "STS & federation",
        "b": "AssumeRole (cross-account, CI), AssumeRoleWithWebIdentity (OIDC — GitHub, Cognito), AssumeRoleWithSAML (corporate IdP). All return temporary credentials. Exam answer pattern: any option involving long-lived access keys distributed to machines is wrong."
      },
      {
        "h": "Billing visibility stack",
        "b": "Budgets (thresholds, can trigger actions like stopping EC2), Cost Explorer (analysis, RI/SP recommendations), Cost & Usage Report (raw detail to S3, query with Athena), Cost Anomaly Detection (ML-based spend spikes), Pricing Calculator (pre-deployment estimates)."
      },
      {
        "h": "CloudTrail vs CloudWatch vs Config",
        "b": "Trail answers <i>who called TerminateInstances?</i> CloudWatch answers <i>what is CPU/memory/log output now, alert me</i>. Config answers <i>is every SG compliant with my rules, and what did this resource look like last Tuesday?</i>"
      },
      {
        "h": "Regions, AZs, edge",
        "b": "Region = isolated geography; AZ = one or more datacentres with independent power/network, connected by low-latency links; edge locations = CloudFront/Route 53 POPs (400+). Multi-AZ = HA; multi-region = DR. You'll exercise both later."
      }
    ],
    "traps": [
      "Budgets and billing metrics live in <b>us-east-1</b> regardless of where workloads run; the EstimatedCharges CloudWatch metric only appears after you enable billing alerts in account preferences.",
      "An SCP cannot grant permissions — if an action is missing from identity policy, allowing it in SCP does nothing.",
      "OIDC role trust must validate <b>both</b> audience (sts.amazonaws.com) and the sub claim; trusting only the provider lets <i>any</i> GitHub repo assume your role.",
      "CloudTrail data events (S3 object-level, Lambda invoke) cost extra and are off by default — management events are the free layer."

        "b": "Use /health for the process and /books or a write/read transaction for database recovery. Record timestamped failures, reconnection and successful data reads. A conventional Multi-AZ instance standby is not readable; Multi-AZ DB clusters have readable instances. The single-zonal-NAT choice is an explicit lab trade-off, not full egress HA. <a href=\"https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateways-regional.html\" target=\"_blank\" rel=\"noopener noreferrer\">Regional NAT</a>"
      },
      {
        "h": "Network layout (memorise this shape)",
        "b": "VPC <code class=\"in\">10.0.0.0/16</code> · public subnets <code class=\"in\">10.0.0.0/24, 10.0.1.0/24</code> (ALB + NAT) · private app subnets <code class=\"in\">10.0.10.0/24, 10.0.11.0/24</code> · private db subnets <code class=\"in\">10.0.20.0/24, 10.0.21.0/24</code>, each pair across AZ a/b. AWS reserves 5 IPs per subnet. One route table per tier. This 6-subnet, 3-tier shape is the template behind most exam scenarios."
      },
      {
        "h": "The security group chain",
        "b": "SGs reference SGs, not CIDRs: <code class=\"in\">alb-sg</code> allows 80 only from your current lab-client CIDR → <code class=\"in\">app-sg</code> allows 8000 <i>from alb-sg</i> → <code class=\"in\">db-sg</code> allows 3306 <i>from app-sg</i>. Now scaling instances never breaks rules, and nothing can reach MySQL except the app tier. SGs are stateful (return traffic auto-allowed) and allow-only; NACLs are stateless, ordered, subnet-level, and can deny — use NACLs only for explicit blocks (e.g., ban an IP)."
      },
      {
        "h": "Stateless app tier",
        "b": "Instances hold no state: sessions would go to ElastiCache/DynamoDB, uploads to S3. Statelessness is what makes the ASG safe to scale in — any instance can die at any time. When an exam scenario mentions \"sticky sessions\", it is usually flagging a design smell to engineer away."
      },
      {
        "h": "Failure modes you will rehearse",
        "b": "(1) Terminate an instance → ASG replaces it, ALB drains it. (2) Reboot-with-failover the RDS primary → app reconnects to same endpoint within ~2 min. (3) Kill the app process → ELB health check marks unhealthy → instance replaced even though EC2 status checks pass. Knowing the difference between EC2 health checks and ELB health checks is worth real marks."
      }

      {
        "h": "ASG scaling policies",
        "b": "Target tracking (keep ALBRequestCountPerTarget ≈ 50 — set and forget, the usual right answer), step scaling (custom thresholds), scheduled (predictable spikes), predictive (ML on history). Cooldowns prevent flapping; lifecycle hooks let you run scripts on launch/terminate."
      },
      {
        "h": "EC2 purchase options",
        "b": "On-Demand (default), Reserved/Savings Plans (1–3yr, steady state, up to ~72% off), Spot (up to 90% off, 2-min interruption notice — batch/stateless only), Dedicated Host (BYOL licensing, compliance). Exam maps workload adjectives to options: \"fault-tolerant batch\" → Spot, \"steady 24/7\" → Savings Plan."
      },
      {
        "h": "Placement groups",
        "b": "Cluster (same rack, lowest latency, HPC), Spread (max 7/AZ, isolate critical instances), Partition (groups on separate racks, Kafka/HDFS)."
      },
      {
        "h": "RDS backup & restore",
        "b": "Automated backups (1–35 days, point-in-time restore), manual snapshots (kept until deleted, shareable cross-account), restore always creates a <b>new</b> instance. Encryption at rest via KMS — can only be enabled at creation; to encrypt later: snapshot → copy-with-encryption → restore."

        "h": "When RDS becomes Aurora",
        "b": "Aurora: MySQL/Postgres-compatible, 6 copies across 3 AZs, up to 15 low-lag replicas sharing storage, failover &lt;30s, Serverless v2 scales by ACU. Exam pattern: \"minimise failover time / read-heavy / variable load on relational\" → Aurora."

        "h": "EBS in one paragraph",

      }

      {
        "t": "Start here: know the route and the stopping points",
        "b": "<p><b>Where:</b> this tab. Follow its steps from top to bottom. No Codex, GitHub Actions, existing app repository or Lab 0 automation is required. Internet is needed to download tools and use AWS; “no AI required” does not mean offline AWS.</p>\n<p>You will prepare Fedora → run the supplied app locally → sign in to AWS → create network and database → upload code → create load balancer and instances → verify → practise recovery → delete resources. The application is a JSON API, not a shopping website.</p>\n<p><b>Before AWS:</b> you need an AWS account with billing enabled for these services and an authorised non-root identity that can create VPC/EC2/ALB/Auto Scaling/RDS/S3 resources, IAM roles/policies and pass the instance role. An organisation may restrict this. A successful sign-in does not grant those permissions. If you only have root access, use the <a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/getting-set-up.html\" target=\"_blank\" rel=\"noopener\">AWS account and administrative-access setup guide</a> first; do not run the lab as root.</p>\n<p><b>Cost checkpoint:</b> local steps create no AWS resources. NAT, ALB, RDS Multi-AZ, EC2, storage and public IPv4 can incur charges when idle. Check Billing → Credits and the <a href=\"https://calculator.aws/\" target=\"_blank\" rel=\"noopener\">AWS Pricing Calculator</a> for this Region before the network step. The legacy budget chip above is not a quote or a spending cap. In Billing → Budgets → Create budget, set a monthly cost budget and email thresholds suitable for your account. Alerts are delayed notifications, not an automatic shutdown.</p>\n<p><b>Success:</b> you know which account to use and have time for the AWS steps plus cleanup in one sitting. You can pause indefinitely after the local checkpoint. After provisioning, use the cleanup step before a long break.</p>\n<p><b>Validation status:</b> this pilot supplies complete reference files. Offline application and document checks are distinct from a real Fedora/MySQL/AWS deployment; only mark cloud steps complete when your checks pass.</p>"
      },
      {
        "t": "Prepare Fedora and choose one working folder",
        "b": "<p><b>Where:</b> Fedora terminal, or VS Code → Terminal → New Terminal. The app uses <a href=\"https://packages.fedoraproject.org/pkgs/python3.11/python3.11/\" target=\"_blank\" rel=\"noopener\">Python 3.11 on Fedora</a> to match EC2; the system Python remains unchanged. These commands install local tools; <code>sudo</code> asks for your Fedora password, not an AWS password. Run one block at a time and read errors before continuing. All later laptop commands start from <code>~/saa-labs/l1-shelflife</code>.</p>\n<p><b>Success:</b> the version commands print Python and Podman versions. If DNF reports a package/repository error, resolve it before continuing. Do not switch to an AWS terminal.</p>",
        "c": "sudo dnf install -y python3 python3-pip python3.11 podman curl unzip jq git tar openssl\nmkdir -p ~/saa-labs/l1-shelflife\ncd ~/saa-labs/l1-shelflife\npython3.11 --version\npodman --version\n"
      },
      {
        "t": "Create the supplied application files",
        "b": "<p><b>Where:</b> Fedora terminal in <code>~/saa-labs/l1-shelflife</code>. Expand “Create all starter files” below and paste the entire block once. It writes the files listed below into this folder; it does not contact AWS. It stops rather than overwrite an existing file. To retry after a partial attempt, inspect the files before removing or renaming them.</p>\n<p>In VS Code use File → Open Folder → <code>~/saa-labs/l1-shelflife</code>. Expand individual reference files if you want to read how they work. You do not need to edit the application to complete the lab.</p>\n<p><b>Success:</b> all file names appear in the terminal. <code>app.py</code> is the API; SQL files create and seed the database; <code>local-up.sh</code> starts local practice; <code>deploy.sh</code> uploads the artifact; <code>smoke.py</code> verifies behaviour. The service file starts the app on EC2. <code>lab.env</code>, created later, records resource identifiers; <code>local.env</code> holds generated local-only passwords. Neither belongs in Git or an AI prompt.</p>",
        "starter": true
      },
      {
        "t": "Run the bookstore locally before spending on AWS",
        "b": "<p><b>Where:</b> Fedora terminal A, in the lab folder. The command downloads MySQL into Podman, publishes it only on your laptop at port 3307, installs Python dependencies in <code>.venv</code>, waits for MySQL and starts the app on port 8000. Keep this terminal open.</p>\n<p><b>Success:</b> Gunicorn reports listening on <code>127.0.0.1:8000</code>. Initial MySQL connection errors during its first startup are retried for up to five minutes. If startup never succeeds, run <code>podman logs shelflife-mysql</code> in another terminal. “Address already in use” means an old app or database is still bound to that port; stop that process before retrying. A container-name conflict should be inspected, not blindly deleted.</p>",
        "c": "cd ~/saa-labs/l1-shelflife\nbash local-up.sh\n"
      },
      {
        "t": "Verify local behaviour and save your first checkpoint",
        "b": "<p><b>Where:</b> a new Fedora terminal B (VS Code terminal “+”). Keep A running while executing the checks below.</p>\n<p><b>Success:</b> health returns <code>status: ok</code>; the test prints PASS, including five successful buys and 45 sold-out responses. It uses a fresh test book, so reruns do not reduce seed stock. Open <code>http://127.0.0.1:8000/books</code> in your browser to see the JSON catalogue.</p>\n<p><b>If it fails:</b> connection refused → check terminal A; HTTP 503 → inspect A and Podman logs; an assertion failure → stop here and preserve output. Do not provision AWS to work around a local failure.</p>\n<p><b>Safe pause:</b> press Ctrl+C in A, then run <code>podman stop shelflife-mysql</code>. Resume with <code>bash local-up.sh</code>. The container retains its database until you remove it. Record “local check passed” and the date in a new <code>notes.md</code> file. Local readiness is not evidence of AWS readiness.</p>",
        "c": "cd ~/saa-labs/l1-shelflife\ncurl -fsS http://127.0.0.1:8000/health | python3 -m json.tool\npython3 smoke.py\n"
      },
      {
        "t": "Install AWS CLI v2 and sign in from Fedora",
        "b": "<p><b>Where:</b> Fedora terminal B and your browser. First run <code>aws --version</code>. If missing or older than 2.32.0, use the installer below; it follows the current <a href=\"https://docs.aws.amazon.com/cli/latest/userguide/getting-started-install.html\" target=\"_blank\" rel=\"noopener\">AWS Linux installer</a>. If you already use a system-managed AWS installation, follow the linked update guidance instead of adding a conflicting second installation. The installer is local setup, not cloud provisioning.</p>\n<p><b>Choose your existing sign-in method:</b></p><ol>\n<li><b>IAM Identity Center / an AWS access portal:</b> run <code>aws configure sso --profile shelflife</code>. Enter session name <code>shelflife</code>, your administrator-provided Start URL and SSO Region (which may differ from the lab Region), accept scope <code>sso:account:access</code>, sign in in the browser, choose the lab account and authorised role, then default Region <code>us-east-1</code> and output <code>json</code>. Run <code>aws sso login --profile shelflife</code>.</li>\n<li><b>Existing IAM/federated Console identity:</b> run <code>aws login --profile shelflife</code>, choose <code>us-east-1</code> and the intended non-root Console session. This needs CLI ≥2.32.0 and <code>SignInLocalDevelopmentAccess</code> permission. An administrator must supply missing permissions. Do not substitute long-lived access keys.</li></ol>\n<p><b>Success:</b> <code>aws sts get-caller-identity --profile shelflife</code> prints the expected Account and a non-root ARN. If it prints an ARN ending in <code>:root</code>, stop and change identity. <code>AccessDenied</code> is an access issue; <code>ExpiredToken</code> means repeat your chosen login command. The <a href=\"https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-sso.html\" target=\"_blank\" rel=\"noopener\">SSO guide</a> and <a href=\"https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-sign-in.html\" target=\"_blank\" rel=\"noopener\">Console sign-in guide</a> describe these separate paths.</p>",
        "c": "# Only if AWS CLI needs installing: download first, then run the official installer.\ncurl -fL https://awscli.amazonaws.com/v2/install.sh -o /tmp/shelflife-aws-install.sh\nbash /tmp/shelflife-aws-install.sh\nexport PATH=\"$HOME/.local/bin:$PATH\"\naws --version\n# Now perform ONE sign-in path described above, then:\naws sts get-caller-identity --profile shelflife\n"
      },
      {
        "t": "Record your account and establish the resume routine",
        "b": "<p><b>Where:</b> Fedora terminal, lab folder. Sign into the same account in the AWS Console. At the top-right choose <b>US East (N. Virginia), us-east-1</b>. Compare the account number in the Console with the CLI result. The command below records the CLI account; only run it after making that comparison.</p>\n<p><code>source ./env.sh</code> loads your profile, Region and previously saved identifiers into this terminal. <code>record NAME value</code> saves a value to <code>lab.env</code>. ARN means the full AWS resource identifier. <code>read -r -p</code> asks you to paste a value: paste the real ID without quotes. No secrets are requested by these recording steps.</p>\n<p><b>Every new terminal / resumed session:</b> <code>cd ~/saa-labs/l1-shelflife</code>, <code>source ./env.sh</code>, then <code>check_account</code>. If expired, repeat your login method from the previous step. The check must succeed before further AWS commands. In notes.md record the last completed step, next step and resources already created. Never restart a creation step without first checking whether its named resource already exists.</p>",
        "c": "cd ~/saa-labs/l1-shelflife\nsource ./env.sh\naws sts get-caller-identity\nrecord ACCOUNT_ID \"$(aws sts get-caller-identity --query Account --output text)\"\ncheck_account\n"
      },
      {
        "t": "Create the VPC and give every subnet a clear name",
        "b": "<p><b>Where:</b> AWS Console → search “VPC” → Your VPCs → Create VPC. <b>Billing starts in this step.</b> A VPC is your network; a subnet is a segment in one Availability Zone (AZ). Public subnets have an internet-gateway route. Private app subnets use NAT for outbound downloads; private database subnets need no internet route.</p>\n<ol><li>Select <b>VPC and more</b>, name prefix <code>shelflife</code>, IPv4 CIDR <code>10.20.0.0/16</code>, no IPv6, default tenancy.</li>\n<li>Select 2 AZs, 2 public subnets, 4 private subnets. Use two offered AZs; call them A and B in your notes. Under subnet CIDR customisation assign the values in the table. Names can be changed afterwards using the Name tag in Subnets.</li>\n<li>For NAT choose <b>one zonal NAT gateway in one AZ</b>, not one per AZ or a regional NAT alternative. Choose S3 gateway endpoint. Leave DNS resolution and DNS hostnames enabled. Preview then create.</li>\n<li>Wait until the NAT gateway is Available. In Subnets rename the six entries by their CIDR, using the table below. Copy their subnet IDs and the VPC ID using the commands below.</li></ol>\n<table><thead><tr><th>Name</th><th>CIDR</th><th>AZ</th><th>Purpose</th></tr></thead><tbody>\n<tr><td>shelflife-public-a</td><td>10.20.0.0/24</td><td>A</td><td>ALB + NAT</td></tr><tr><td>shelflife-public-b</td><td>10.20.1.0/24</td><td>B</td><td>ALB</td></tr>\n<tr><td>shelflife-app-a</td><td>10.20.10.0/24</td><td>A</td><td>EC2</td></tr><tr><td>shelflife-app-b</td><td>10.20.11.0/24</td><td>B</td><td>EC2</td></tr>\n<tr><td>shelflife-db-a</td><td>10.20.20.0/24</td><td>A</td><td>RDS</td></tr><tr><td>shelflife-db-b</td><td>10.20.21.0/24</td><td>B</td><td>RDS</td></tr></tbody></table>\n<p><b>Success:</b> one VPC, six correctly named subnets, one Available NAT, one attached internet gateway and an S3 gateway endpoint. If the wizard offers different defaults, match these explicit settings; do not accept extra NAT gateways silently. A single NAT is a deliberate cost/availability trade-off for this lab.</p>",
        "c": "source ./env.sh\nread -r -p 'VPC ID (vpc-...): ' value; record VPC_ID \"$value\"\nread -r -p 'Public A subnet ID: ' value; record PUBLIC_A \"$value\"\nread -r -p 'Public B subnet ID: ' value; record PUBLIC_B \"$value\"\nread -r -p 'App A subnet ID: ' value; record APP_A \"$value\"\nread -r -p 'App B subnet ID: ' value; record APP_B \"$value\"\nread -r -p 'DB A subnet ID: ' value; record DB_A \"$value\"\nread -r -p 'DB B subnet ID: ' value; record DB_B \"$value\"\naws ec2 describe-subnets --filters \"Name=vpc-id,Values=$VPC_ID\" \\\n  --query 'Subnets[].{ID:SubnetId,CIDR:CidrBlock,AZ:AvailabilityZone}' --output table\n"
      },
      {
        "t": "Check routes and isolate the database subnets",
        "b": "<p><b>Where:</b> VPC Console → Subnets. Select each subnet → Route table tab. Public A/B must have <code>0.0.0.0/0 → igw-…</code>; App A/B must have <code>0.0.0.0/0 → nat-…</code>, plus the VPC local route and S3 endpoint route.</p>\n<p>Create a separate DB route table: Route tables → Create route table → name <code>shelflife-db-rt</code> → this VPC. In Subnet associations → Edit subnet associations, select only DB A and DB B → Save. Leave its Routes with only <code>10.20.0.0/16 → local</code>. Do not delete routes from an app route table to achieve this.</p>\n<p><b>Success:</b> both DB subnets now use the new local-only table; both app subnets still use NAT. Open Endpoints → the S3 gateway endpoint → Route tables and check the app route tables are associated. Keep the default network ACLs unchanged. If app downloads fail later, recheck these associations first.</p>"
      },
      {
        "t": "Create the three security groups and their exact rules",
        "b": "<p><b>Where:</b> VPC Console → Security groups → Create security group. Create <code>alb-sg</code>, <code>app-sg</code>, <code>db-sg</code>, each with a description and the <b>shelflife VPC</b>. A security group is a stateful firewall on a resource. Create all three groups first, then edit rules so they can refer to each other.</p>\n<table><thead><tr><th>Group</th><th>Inbound rules</th><th>Outbound rules</th></tr></thead><tbody>\n<tr><td>alb-sg</td><td>HTTP TCP 80; source “My IP” (your public IPv4 /32)</td><td>Custom TCP 8000; destination app-sg. Remove default all-traffic egress.</td></tr>\n<tr><td>app-sg</td><td>Custom TCP 8000; source alb-sg</td><td>Retain default all-traffic egress for package downloads, AWS APIs and database traffic in this disposable lab.</td></tr>\n<tr><td>db-sg</td><td>MySQL/Aurora TCP 3306; source app-sg</td><td>Retain default egress.</td></tr></tbody></table>\n<p>For a group reference, choose Custom then search by the other group's ID. No inbound SSH/22 and no public database rule are needed. “My IP” is the laptop's current internet address, not <code>192.168…</code>. Update it if your network/VPN changes. This HTTP-only lab uses synthetic books; do not submit personal or sensitive data.</p>\n<p><b>Success:</b> browser → ALB on 80; ALB → app on 8000; app → DB on 3306. Copy each security-group ID from its details.</p>",
        "c": "read -r -p 'alb-sg ID (sg-...): ' value; record ALB_SG \"$value\"\nread -r -p 'app-sg ID (sg-...): ' value; record APP_SG \"$value\"\nread -r -p 'db-sg ID (sg-...): ' value; record DB_SG \"$value\"\n"
      },
      {
        "t": "Create the database subnet group, then RDS MySQL",
        "b": "<p><b>Where:</b> AWS Console → search “RDS” (may display Aurora and RDS) → Subnet groups → Create DB subnet group. Name <code>shelflife-db-subnets</code>, description “Lab 1 database subnets”, this VPC, AZs A/B, select only DB A/B → Create.</p>\n<p>Go to Databases → Create database → <b>Standard create</b>. Set the following deliberately; templates may change several defaults.</p>\n<table><thead><tr><th>Field</th><th>Value</th></tr></thead><tbody>\n<tr><td>Engine / version</td><td>MySQL 8.4, choose a supported minor release offered in this Region. Do not choose 8.0: its RDS standard support ended 31 July 2026. See the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/MySQL.Concepts.VersionMgmt.html\" target=\"_blank\" rel=\"noopener\">AWS version-support table</a>.</td></tr>\n<tr><td>Availability</td><td>Multi-AZ DB instance deployment (one primary + one standby). Do not choose the three-instance Multi-AZ cluster.</td></tr>\n<tr><td>Identifier / master username</td><td>shelflife-db / labadmin</td></tr>\n<tr><td>Credentials</td><td>Manage master credentials in AWS Secrets Manager; default aws/secretsmanager key.</td></tr>\n<tr><td>Instance / storage</td><td>Burstable db.t3.micro, gp3, 20 GiB; disable storage autoscaling for this bounded experiment. If unavailable, review the offered configuration and its price before substituting.</td></tr>\n<tr><td>Connectivity</td><td>Do not connect to an EC2 resource automatically; shelflife VPC; shelflife-db-subnets; Public access No; existing db-sg only, remove default SG.</td></tr>\n<tr><td>Additional configuration</td><td>Initial database name <b>shelflife</b>; port 3306; storage encryption on with default key; backup retention 1 day; deletion protection off for this disposable database.</td></tr>\n<tr><td>Monitoring</td><td>Disable optional paid advanced monitoring/Enhanced Monitoring and optional log exports for this pilot; keep default basic metrics.</td></tr>\n<tr><td>Tag</td><td>Project = shelflife</td></tr></tbody></table>\n<p>Review the cost estimate and create. Wait until status is <b>Available</b> (often 10–20 minutes). <b>Success:</b> Configuration shows Multi-AZ Yes, correct VPC/subnets, and a managed secret. The app discovers the endpoint and secret through RDS; do not copy the database password.</p>\n<p><b>If it fails:</b> unsupported class/version → check the offered combinations; subnet error → confirm two different AZs; AccessDenied → the signed-in provisioning identity needs the reported permission. Do not make the database public. The app uses the managed master credential for this isolated teaching lab; a production app needs a separate restricted SQL user.</p>",
        "c": "aws rds wait db-instance-available --db-instance-identifier shelflife-db\nrecord SECRET_ARN \"$(aws rds describe-db-instances --db-instance-identifier shelflife-db \\\n  --query 'DBInstances[0].MasterUserSecret.SecretArn' --output text)\"\naws rds describe-db-instances --db-instance-identifier shelflife-db \\\n  --query 'DBInstances[0].{Status:DBInstanceStatus,MultiAZ:MultiAZ,Public:PubliclyAccessible,Database:DBName}'\n"
      },
      {
        "t": "Create a private artifact bucket and upload the tested app",
        "b": "<p><b>Where:</b> Fedora terminal. First run the recording command to obtain a globally unique bucket name, then create it in the Console: S3 → Create bucket → General purpose → Region us-east-1 → paste the printed name. Keep Block all public access ON, ACLs disabled, default SSE-S3 encryption, and <b>versioning disabled</b> for the simple cleanup path. Add Project=shelflife. Create bucket.</p>\n<p>Then run <code>bash deploy.sh</code>. It packages only the application, SQL, service unit, dependency versions and RDS trust certificate; it excludes local passwords, AWS credentials and lab.env. Certificate verification remains enabled for the RDS connection.</p>\n<p><b>Success:</b> S3 → your bucket → Objects shows <code>app.tar.gz</code>. A missing requirements.lock.txt means you skipped successful local setup. AccessDenied on upload means the provisioning identity lacks bucket permissions. A bucket-name collision can be resolved by recording a different suffix and creating that name; do not use someone else's bucket.</p>",
        "c": "record BUCKET \"shelflife-artifacts-${ACCOUNT_ID}-$(openssl rand -hex 3)\"\nprintf 'Create this bucket in S3: %s\\n' \"$BUCKET\"\n# After creating the bucket in the Console:\nbash deploy.sh\n"
      },
      {
        "t": "Give EC2 its own role for S3, RDS, secrets and Session Manager",
        "b": "<p><b>Where:</b> Fedora terminal generates a policy file; AWS Console → IAM creates the role. This role belongs to EC2, not to your laptop. Generate the JSON below, then inspect it with <code>cat instance-policy.json</code>.</p>\n<ol><li>IAM → Roles → Create role → Trusted entity “AWS service” → Use case “EC2” → Next.</li><li>Search and select <code>AmazonSSMManagedInstanceCore</code> → Next → Role name <code>shelflife-ec2-role</code> → Create role.</li><li>Open the role → Add permissions → Create inline policy → JSON. Replace the editor contents with instance-policy.json. Next → name <code>shelflife-runtime</code> → Create policy.</li></ol>\n<p>S3 reads are scoped to this one artifact; secret reads to this one secret. RDS DescribeDBInstances uses Resource * because the action does not support resource-level scoping. The SSM policy enables browser Session Manager without opening port 22. No application access keys are created.</p>\n<p><b>Success:</b> role shows both policies, and Trusted relationships allows <code>ec2.amazonaws.com</code>. Creating the role via the Console also creates its instance profile. It may take a short time to appear in EC2's role selector. The default Secrets Manager key avoids an extra customer-managed KMS policy in this pilot.</p>",
        "c": "python3 - <<'PY'\nimport json, os\nfrom pathlib import Path\npolicy={'Version':'2012-10-17','Statement':[\n {'Effect':'Allow','Action':['s3:GetObject'],'Resource':f\"arn:aws:s3:::{os.environ['BUCKET']}/app.tar.gz\"},\n {'Effect':'Allow','Action':['rds:DescribeDBInstances'],'Resource':'*'},\n {'Effect':'Allow','Action':['secretsmanager:GetSecretValue'],'Resource':os.environ['SECRET_ARN']}\n]}\nPath('instance-policy.json').write_text(json.dumps(policy,indent=2))\nprint('Created instance-policy.json; paste its contents into the inline policy editor.')\nPY\n"
      },
      {
        "t": "Create the target group and load balancer BEFORE the instances",
        "b": "<p><b>Where:</b> EC2 Console → Target groups → Create target group. Type Instances; name <code>shelflife-tg</code>; HTTP port <b>8000</b>; IPv4; shelflife VPC; HTTP1. Health-check protocol HTTP, path <code>/health</code>; success code 200. Next → skip registering targets → Create. Copy its ARN.</p>\n<p>EC2 → Load balancers → Create → Application Load Balancer. Name <code>shelflife-alb</code>; Internet-facing; IPv4; shelflife VPC; AZ A/Public A and AZ B/Public B. Security groups: <code>alb-sg</code> only. Listener HTTP:80 → forward to shelflife-tg. Create and wait for State Active. Copy its ARN and DNS name from Details. Do not add <code>http://</code> to the saved DNS value.</p>\n<p><b>Success:</b> target group exists, listener forwards to it, ALB is Active. With no instances yet, a browser HTTP 503 from the ALB is expected. We create the target group first so the Auto Scaling group can attach to it explicitly.</p>",
        "c": "read -r -p 'Target group ARN: ' value; record TG_ARN \"$value\"\nread -r -p 'Load balancer ARN: ' value; record ALB_ARN \"$value\"\nread -r -p 'Load balancer DNS name: ' value; record ALB_DNS \"$value\"\n"
      },
      {
        "t": "Generate the complete EC2 startup script",
        "b": "<p><b>Where:</b> Fedora terminal. This creates <code>user-data.sh</code> with your actual bucket name. A launch template's user data runs on each new EC2 instance: install Python, download the artifact, create a dedicated OS user, install dependencies and start the service.</p>\n<p><b>Success:</b> user-data.sh exists and <code>bash -n</code> reports no syntax errors. Inspect it in VS Code. It has a bucket identifier but no password. Database migration runs before Gunicorn starts, takes a database lock so two instances do not race, and uses seed inserts that preserve existing stock.</p>",
        "c": "python3 - <<'PY'\nimport os\nfrom pathlib import Path\nbucket=os.environ['BUCKET']\nscript=\"\"\"#!/bin/bash\nset -euo pipefail\ndnf install -y python3.11 python3.11-pip awscli2\nid appuser >/dev/null 2>&1 || useradd --system --home /opt/app appuser\nmkdir -p /opt/app\naws s3 cp s3://BUCKET_NAME/app.tar.gz /opt/app.tar.gz --region us-east-1\ntar -xzf /opt/app.tar.gz -C /opt/app\npython3.11 -m venv /opt/app/venv\n/opt/app/venv/bin/pip install -r /opt/app/requirements-deploy.txt\nchown -R appuser:appuser /opt/app\ninstall -m 0644 /opt/app/shelflife.service /etc/systemd/system/shelflife.service\nsystemctl daemon-reload\nsystemctl enable --now shelflife.service\n\"\"\"\nPath('user-data.sh').write_text(script.replace('BUCKET_NAME',bucket))\nprint('Created user-data.sh')\nPY\nbash -n user-data.sh\n"
      },
      {
        "t": "Create the launch template",
        "b": "<p><b>Where:</b> EC2 Console → Launch templates → Create launch template.</p>\n<ol><li>Name <code>shelflife-lt</code>; description “Lab 1 Fedora pilot”; AMI: Quick Start → Amazon Linux → <b>Amazon Linux 2023, x86_64</b>. Do not choose ARM, Amazon Linux 2 or a Marketplace image.</li><li>Instance type <code>t3.micro</code>. Key pair: proceed without a key pair (SSM replaces SSH). Network: do not include a subnet in the template; choose existing security group app-sg.</li><li>Storage: one 8 GiB gp3 root volume, encrypted, Delete on termination ON. Resource tags: Project=shelflife for both instances and volumes.</li><li>Advanced details → IAM instance profile <code>shelflife-ec2-role</code>; detailed CloudWatch monitoring disabled; metadata endpoint enabled, <b>IMDSv2 required</b>, metadata hop limit 1; credit specification Standard for bounded CPU-credit behaviour.</li><li>Advanced details → User data: paste the complete contents of user-data.sh. Leave “already base64 encoded” unchecked. Create template.</li></ol>\n<p><b>Success:</b> launch template version 1 shows the correct AMI architecture, instance profile, app-sg and startup script. Fedora is your workstation; Amazon Linux is the EC2 operating system. If the profile is missing, verify the IAM role and wait for propagation.</p>"
      },
      {
        "t": "Create the Auto Scaling group and wait for healthy targets",
        "b": "<p><b>Where:</b> EC2 Console → Auto Scaling groups → Create Auto Scaling group. Name <code>shelflife-asg</code>; choose shelflife-lt, explicit version 1. Network: shelflife VPC, App A and App B only. Choose balanced distribution across AZs when offered.</p>\n<p>Attach to an existing load balancer → choose shelflife-tg. Enable Elastic Load Balancing health checks in addition to EC2 checks; health-check grace period <b>600 seconds</b> so first-time package installation can finish. Set desired 2, minimum 2, maximum 4. Skip scaling policies for now. Add tag Project=shelflife with propagation to instances. Review and create.</p>\n<p><b>Success:</b> ASG → Activity shows two successful launches. EC2 shows two running instances in different app subnets, <b>no public IPv4</b>. Target groups → shelflife-tg → Targets eventually shows two Healthy entries (allow 10 minutes).</p>\n<p><b>If not:</b> do not repeatedly create groups. Use the next diagnostic step. A launch failure commonly means an IAM pass-role restriction, instance quota, unavailable capacity or wrong AMI architecture; the ASG Activity message distinguishes them.</p>"
      },
      {
        "t": "Inspect a private instance and resolve startup failures",
        "b": "<p><b>Where:</b> EC2 → Instances → select one instance belonging to shelflife-asg → Connect → Session Manager → Connect. The browser opens a terminal on that EC2 instance. <b>Only the block below runs in this remote terminal.</b> All other command blocks in this walkthrough run on Fedora.</p>\n<p>Session Manager unavailable? Check the instance profile includes AmazonSSMManagedInstanceCore; app subnet has an active NAT route; DNS resolution is enabled; the instance is running. The Amazon Linux 2023 AMI normally supplies SSM Agent. Do not open SSH as a workaround.</p>\n<p><b>Success:</b> service Active, localhost /health returns 200 and localhost /books returns data. If bootstrap failed, /var/log/cloud-init-output.log identifies a failed package or S3 download. S3 AccessDenied → inspect instance-policy bucket ARN; secret AccessDenied → inspect SECRET_ARN policy; database timeout → app/db security-group chain and db-sg attachment; “Unknown database” → initial database name must be shelflife.</p>\n<p>If RDS was still starting, the service retries every 15 seconds. After repairing configuration, use <code>sudo systemctl restart shelflife</code>. For failed package/artifact bootstrap, correct the template/user data and replace the failed instance through the ASG; avoid treating manual changes to one instance as the final deployment.</p>",
        "c": "sudo systemctl status shelflife --no-pager\nsudo tail -n 60 /var/log/cloud-init-output.log\nsudo journalctl -u shelflife -n 60 --no-pager\ncurl -fsS http://127.0.0.1:8000/health\ncurl -fsS http://127.0.0.1:8000/books\n"
      },
      {
        "t": "Verify the deployed application from Fedora",
        "b": "<p><b>Where:</b> Fedora terminal. Close or leave the browser Session Manager tab; do not paste these commands into it.</p>\n<p><b>Success:</b> /health returns an instance ID/AZ, /books returns seed data, and smoke.py passes against the ALB. Repeated /whoami requests should eventually show both instance IDs; it is not guaranteed to alternate each request. Save output in notes.md and capture the target-group Healthy screen for Evidence &amp; Drills.</p>\n<p><b>If it fails:</b> browser timeout → ALB public subnets/IGW and alb-sg My IP; ALB 503 → no healthy targets; /health works but /books 503 → database path, not load balancing. Recheck the previous step before changing several settings at once.</p>",
        "c": "cd ~/saa-labs/l1-shelflife\nsource ./env.sh\ncheck_account\ncurl -fsS \"http://$ALB_DNS/health\"\npython3 smoke.py \"http://$ALB_DNS\"\nfor attempt in $(seq 1 10); do\n  curl -fsS \"http://$ALB_DNS/whoami\"\n  printf '\\n'\ndone\n"
      },
      {
        "t": "Practise one manual rolling deployment",
        "b": "<p><b>Where:</b> Fedora terminal. For the first exercise, redeploy the same tested artifact; a code change is not required to learn replacement. <code>--refresh</code> uploads it and asks the ASG to replace instances while keeping at least 50% healthy.</p>\n<p><b>Success:</b> the command returns an InstanceRefreshId. In ASG → Instance refresh, wait for Successful; Targets shows two healthy replacement instances. Run the cloud smoke test again. If failed, open its status reason and the remote logs before retrying. Do not overlap refreshes or a recovery drill.</p>\n<p>This pilot uses a fixed artifact key for simplicity: it is a manual lab deployment, not immutable versioned artifact promotion. If a change breaks the app, restore the known-good local reference files, rerun local tests and upload/refresh again. GitHub Actions/OIDC automation can be a later exercise; it is not a prerequisite here.</p>",
        "c": "bash deploy.sh --refresh\naws autoscaling describe-instance-refreshes --auto-scaling-group-name shelflife-asg \\\n  --query 'InstanceRefreshes[0].{Status:Status,Reason:StatusReason,Progress:PercentageComplete}'\n# After the Console reports Successful:\npython3 smoke.py \"http://$ALB_DNS\"\n"
      },
      {
        "t": "Observe scaling with a short, bounded load test",
        "b": "<p><b>Where:</b> Console then Fedora. ASG → Automatic scaling → Create dynamic scaling policy → Target tracking; name <code>shelflife-requests</code>; metric Application Load Balancer request count per target; select shelflife-tg and its ALB; target value 50; warmup 180 seconds; scale-in enabled. Keep maximum 4.</p>\n<p>Run the command below once. It sends GET requests only for three minutes and stops. Do not change your ALB ingress to accept the whole internet. Keep the ASG Activity tab and CloudWatch metrics open; scaling uses metric periods and warmup, so changes are not immediate. /books exercises the database too.</p>\n<p><b>Success:</b> save the observed request rate, target count, ASG activity and error count. If no scale-out happens, inspect the metric/policy selection and whether the test exceeded its threshold; record “not observed” rather than invent evidence or run indefinitely. After observing, delete this scaling policy and restore desired/minimum 2; wait for two healthy targets before recovery drills.</p>",
        "c": "podman run --rm docker.io/williamyeh/hey -z 3m -c 20 \"http://$ALB_DNS/books\"\n"
      },
      {
        "t": "Run recovery drills one at a time and measure the right endpoint",
        "b": "<p><b>Where:</b> two Fedora terminals plus the AWS Console. In terminal A run the timestamped /books probe below; it is read-only. Stop it with Ctrl+C when finished. In terminal B load the lab folder and env.sh as usual.</p>\n<ol><li><b>Instance replacement:</b> in EC2 select exactly one instance shown under shelflife-asg → Instance state → Terminate instance → confirm that one ID. Watch ASG Activity replace it. Record time to healthy replacement and any failed /books probes. Wait for two healthy targets.</li>\n<li><b>RDS failover:</b> RDS → shelflife-db → Actions → Reboot → check “Reboot with failover” → confirm. Watch /books fail and recover; record elapsed recovery and compare with /health in the browser. /health staying green proves only the application process is alive.</li>\n<li><b>Network diagnosis:</b> copy/screenshot db-sg's inbound rule, then temporarily remove only its 3306-from-app-sg rule. Observe /books errors. Restore the exact rule immediately and verify /books recovery. This deliberate fault affects only this disposable lab.</li></ol>\n<p><b>Success:</b> each drill has before/after timestamps and a restored working app. Run smoke.py afterwards. The buy endpoint avoids overselling through an InnoDB transaction and row lock; a lost response during a write can still leave an uncertain outcome. Do not blindly retry purchases after a timeout—the app is not a production idempotent payment system.</p>",
        "c": "cd ~/saa-labs/l1-shelflife\nsource ./env.sh\nwhile true; do\n  printf '%s ' \"$(date -Is)\"\n  curl --max-time 10 -s -o /dev/null -w '%{http_code}\\n' \"http://$ALB_DNS/books\" || true\n  sleep 2\ndone\n"
      },
      {
        "t": "Save evidence and choose resume or cleanup",
        "b": "<p><b>Where:</b> notes.md on Fedora and this manual's existing Evidence &amp; Drills tab. Record account alias/Region, last completed step, resource names/IDs, smoke result, scaling observation, recovery measurements and any remaining failure. Record spend separately from remaining credits. Do not record secret values.</p>\n<p><b>Short interruption:</b> on return, open the lab folder, source env.sh, log in if needed, check_account, verify ASG/targets/RDS status, then rerun /health and /books. Resume the first incomplete step. If your public IP changed, update alb-sg's My IP rule.</p>\n<p><b>Overnight or an uncertain return:</b> use the next cleanup steps. Closing VS Code, stopping local Podman or signing out of AWS does not stop AWS charges. Setting desired capacity to zero alone still leaves the ALB, NAT, RDS and other resources. After full cleanup, archive the old lab.env, repeat sign-in/account recording (steps 06–07) to create a new lab.env, then rebuild AWS from step 08. Retain the local app files; do not rerun the starter-file creator over them.</p>"
      },
      {
        "t": "Cleanup part 1: remove compute, load balancing and database",
        "b": "<p><b>Where:</b> AWS Console in the recorded account and us-east-1. These actions destroy the lab's synthetic data. Use this explicit checklist rather than the older placeholder commands in the Teardown tab; that tab is unchanged by this pilot.</p>\n<ol><li>Stop the probe/load test and wait for any instance refresh to finish or cancel it. EC2 → Auto Scaling groups → shelflife-asg → Edit → minimum 0 and desired 0 → Update. Wait for its instances to terminate. Delete shelflife-asg; confirm it is gone.</li>\n<li>EC2 → Load balancers → shelflife-alb → Actions → Delete. Wait until gone. Target groups → shelflife-tg → Delete. Launch templates → shelflife-lt → Delete all versions/template.</li>\n<li>RDS → shelflife-db → Actions → Delete. Disable deletion protection first if it was enabled. For this disposable synthetic database, uncheck final snapshot and retained automated backups; acknowledge and delete. Wait until it is gone before removing its subnet group or network. Delete shelflife-db-subnets.</li>\n<li>RDS → Snapshots and Automated backups → Retained: filter this lab and delete any lab snapshots/backups you deliberately or accidentally retained, or record their cost and expiry. RDS normally removes its managed secret with the database; verify its status in Secrets Manager. Do not delete unrelated secrets or AWS-managed keys.</li>\n<li>EC2 → Instances/Volumes: verify the lab instances terminated and their root volumes disappeared. Delete any unattached volume that you have positively identified as this lab's. Inspect Snapshots and AMIs if you created any extras.</li></ol>\n<p><b>Success:</b> no lab ASG, EC2 instances, EBS volumes, ALB/target group, RDS database or retained snapshots/backups. “Deleting” is not yet complete; wait for dependencies to release.</p>"
      },
      {
        "t": "Cleanup part 2: remove networking, bucket and role; reconcile cost",
        "b": "<p><b>Where:</b> AWS Console; work only on resources belonging to shelflife.</p>\n<ol><li>VPC → NAT gateways → the gateway in the recorded VPC → Delete. Wait for Deleted. EC2 → Elastic IPs → its now-unassociated address → Actions → Release. NAT deletion does not release the address automatically.</li>\n<li>VPC → Endpoints → S3 gateway endpoint in this VPC → Delete. If other endpoints were added during troubleshooting, review and remove those lab endpoints too.</li>\n<li>VPC → Security groups: remove the cross-group rules you added, then delete alb-sg, app-sg and db-sg. Leave the VPC's default group for VPC deletion. A dependency error means an interface/resource still uses the group; inspect Network interfaces and wait for ALB/RDS deletion. Do not force-delete service-managed interfaces.</li>\n<li>VPC → Your VPCs → shelflife VPC → Actions → Delete VPC. Review the associated subnets, route tables and internet gateway shown for deletion. If blocked, use the dependency named in the error to find the remaining lab resource, remove it and retry. Verify the recorded VPC disappears.</li>\n<li>S3 → recorded bucket → Empty. Confirm all objects are removed. If you enabled versioning, remove all versions and delete markers as well; check for incomplete multipart uploads if you performed extra uploads. Then Delete bucket.</li>\n<li>IAM → Roles → shelflife-ec2-role → Delete. If the instance profile remains, remove it using the conditional checks below. Delete the local Podman container only when you no longer need its local data.</li>\n<li>CloudWatch → Logs and Alarms: inspect for lab-named extras and remove or explicitly retain them. Inspect AWS Backup recovery points, EFS, custom KMS keys, security services or resources in other Regions only if you enabled them beyond this pilot; record every addition in notes.md so it is not missed.</li></ol>\n<p><b>Success:</b> reconcile each resource you created against its service Console, including released public IPv4 addresses and retained storage. An access error or unknown resource is “cleanup incomplete”, not success. No account-wide automated audit is claimed; this pilot does not require an absent tools/audit.sh.</p>\n<p>Check Billing → Cost Explorer on the next day, group by Service and filter the relevant dates/Region. Data can lag: review again if necessary. Keep your notes until the bill is understood. Review the existing Teardown tab for the rationale; these two steps supply the novice actions without changing that tab.</p>",
        "c": "# Fedora, only AFTER the Console role deletion:\nsource ./env.sh\ncheck_account\naws iam list-instance-profiles --query \"InstanceProfiles[?InstanceProfileName=='shelflife-ec2-role'].{Name:InstanceProfileName,Roles:Roles[*].RoleName}\"\n# If the profile exists and Roles is empty, remove it:\n# aws iam delete-instance-profile --instance-profile-name shelflife-ec2-role\n# If Roles is not empty, inspect that role and finish its removal first.\n\n# Optional local cleanup; removes only the disposable local MySQL container and its data:\npodman stop shelflife-mysql\npodman rm -v shelflife-mysql\n"
      }

    "handoff": "Optional AI Help — ShelfLife, Fedora pilot\n\nThe Build & Deploy tab is complete without AI. Use these prompts only when useful.\nGive an assistant ONE step and the relevant file/error, not the entire handbook.\nDo not provide local.env, AWS credential/cache files, secret values or unredacted credentials.\nKeep resource creation, IAM changes and deletion under your control.\n\nEXPLAIN A STEP\nI am following ShelfLife Lab 1 on Fedora. My current step is [number/title].\nHere is its text: [paste step]. Explain its purpose in plain language, define\nunfamiliar AWS terms, and tell me what successful completion looks like.\nDo not introduce new tools or change the architecture. Ask for a missing fact\nrather than guessing account settings. End with one question to check my understanding.\n\nDIAGNOSE AN ERROR\nCurrent step: [number/title]. Execution location: [Fedora / AWS Console / EC2 Session Manager].\nLast successful checkpoint: [result]. Expected result: [result].\nExact command and redacted error: [paste]. Relevant file only: [paste if needed].\nGive the most likely cause and one read-only diagnostic action first.\nExplain what each possible result means. Do not suggest AdministratorAccess,\npublic database access, opening SSH, disabling TLS or deleting resources as a shortcut.\nDo not claim commands ran. After two unsuccessful attempts, summarise evidence\nso I can continue with another model without repeating the whole conversation.\n\nMAKE ONE OPTIONAL CODE CHANGE\nFile: [one file]. Requested change: [one small behaviour].\nCurrent contents: [paste]. Preserve the existing routes, environment-variable\ncontract, parameterised SQL, row-lock transaction and separate /health vs /books.\nPropose a small patch and a meaningful test. Do not edit infrastructure or deploy.\nTell me the exact local command to check the change and the expected result.\nIf you cannot keep the change small, explain why before generating more files.\n\nRESUME WITH A DIFFERENT ASSISTANT\nEnvironment: Fedora + Podman; AWS us-east-1; ShelfLife Flask/MySQL lab.\nCompleted steps: [list]. Last check: [command + result]. Current problem: [one sentence].\nResources already present: [names, redacted IDs if preferred; no secrets].\nNext planned step: [number/title]. Relevant file/error: [paste].\nHelp only with that next step. Do not recreate existing resources or restart the lab.\n",

      "files": {
        "requirements.txt": "Flask>=3.1,<4\nPyMySQL[rsa]>=1.1.1,<2\nboto3>=1.40,<2\ngunicorn>=23,<24\n",
        "app.py": "import json\nimport os\nimport time\nimport threading\nimport urllib.request\nfrom contextlib import closing\nfrom pathlib import Path\n\nimport boto3\nimport pymysql\nfrom botocore.exceptions import BotoCoreError, ClientError\nfrom flask import Flask, jsonify, request\n\napp = Flask(__name__)\napp.config['MAX_CONTENT_LENGTH'] = 16384\n_cache = {}\n_lock = threading.Lock()\n\ndef identity():\n    if os.getenv('APP_MODE', 'local') == 'local':\n        return {'instance_id': 'local', 'az': 'local'}\n    if 'identity' not in _cache:\n        # Disable proxies for the link-local metadata endpoint. IMDSv2 only.\n        opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))\n        base = 'http://169.254.169.254/latest/'\n        req = urllib.request.Request(base+'api/token', method='PUT',\n            headers={'X-aws-ec2-metadata-token-ttl-seconds': '60'})\n        with opener.open(req, timeout=2) as response:\n            token = response.read().decode()\n        req = urllib.request.Request(base+'dynamic/instance-identity/document',\n            headers={'X-aws-ec2-metadata-token': token})\n        with opener.open(req, timeout=2) as response:\n            doc = json.load(response)\n        _cache['identity'] = {'instance_id': doc['instanceId'], 'az': doc['availabilityZone']}\n    return _cache['identity']\n\ndef db_settings(force=False):\n    if os.getenv('APP_MODE', 'local') == 'local':\n        return dict(host='127.0.0.1', port=3307, user='shelflife',\n                    password=os.environ['MYSQL_PASSWORD'])\n    with _lock:\n        if force or time.monotonic() >= _cache.get('expires', 0):\n            region = os.environ['AWS_DEFAULT_REGION']\n            db = boto3.client('rds', region_name=region).describe_db_instances(\n                DBInstanceIdentifier=os.environ['DB_INSTANCE'])['DBInstances'][0]\n            secret = boto3.client('secretsmanager', region_name=region).get_secret_value(\n                SecretId=db['MasterUserSecret']['SecretArn'])\n            value = json.loads(secret['SecretString'])\n            _cache['db'] = dict(host=db['Endpoint']['Address'], port=db['Endpoint']['Port'],\n                user=value['username'], password=value['password'],\n                ssl_ca=str(Path(__file__).with_name('global-bundle.pem')),\n                ssl_verify_cert=True, ssl_verify_identity=True)\n            _cache['expires'] = time.monotonic()+60\n        return dict(_cache['db'])\n\ndef connect():\n    def open_db(force=False):\n        return pymysql.connect(**db_settings(force), database='shelflife',\n            connect_timeout=5, read_timeout=10, write_timeout=10,\n            cursorclass=pymysql.cursors.DictCursor, autocommit=False)\n    try:\n        return open_db()\n    except pymysql.OperationalError:\n        # Retry connection setup only: resolve a rotated secret or changed endpoint.\n        # Never replay a write when the commit result is unknown.\n        return open_db(force=True)\n\ndef migrate():\n    with closing(connect()) as db, db.cursor() as cur:\n        cur.execute(\"SELECT GET_LOCK('shelflife-migration', 60) AS acquired\")\n        if cur.fetchone()['acquired'] != 1:\n            raise RuntimeError('Migration lock timed out; retry after checking database')\n        try:\n            for name in ('schema.sql', 'seed.sql'):\n                for statement in Path(__file__).with_name(name).read_text().split(';'):\n                    if statement.strip():\n                        cur.execute(statement)\n            db.commit()\n        finally:\n            cur.execute(\"SELECT RELEASE_LOCK('shelflife-migration')\")\n\n@app.get('/health')\ndef health():\n    # No database calls. Green process health does not prove database recovery.\n    return jsonify(status='ok', **identity())\n\n@app.get('/whoami')\ndef whoami():\n    return jsonify(**identity())\n\n@app.get('/books')\ndef books():\n    with closing(connect()) as db, db.cursor() as cur:\n        cur.execute('SELECT id,title,author,stock FROM books ORDER BY id')\n        return jsonify(cur.fetchall())\n\n@app.post('/books')\ndef create_book():\n    body=request.get_json(silent=True)\n    if (not isinstance(body,dict) or\n        any(not isinstance(body.get(k),str) or not 1 <= len(body[k].strip()) <= 200\n            for k in ('title','author')) or\n        type(body.get('stock')) is not int or not 0 <= body['stock'] <= 1000000):\n        return jsonify(error='Provide title, author (1–200 characters), and integer stock 0–1000000'),400\n    with closing(connect()) as db, db.cursor() as cur:\n        cur.execute('INSERT INTO books(title,author,stock) VALUES (%s,%s,%s)',\n                    (body['title'].strip(),body['author'].strip(),body['stock']))\n        book_id=cur.lastrowid\n        db.commit()\n    return jsonify(id=book_id),201\n\n@app.post('/books/<int:book_id>/buy')\ndef buy(book_id):\n    with closing(connect()) as db, db.cursor() as cur:\n        db.begin()\n        cur.execute('SELECT stock FROM books WHERE id=%s FOR UPDATE',(book_id,))\n        row=cur.fetchone()\n        if not row:\n            db.rollback()\n            return jsonify(error='Book not found'),404\n        if row['stock'] <= 0:\n            db.rollback()\n            return jsonify(error='Out of stock'),409\n        cur.execute('UPDATE books SET stock=stock-1 WHERE id=%s',(book_id,))\n        db.commit()\n    return jsonify(id=book_id,stock=row['stock']-1)\n\n@app.errorhandler(pymysql.MySQLError)\n@app.errorhandler(BotoCoreError)\n@app.errorhandler(ClientError)\ndef database_error(exc):\n    # Keep credentials and SQL details out of the response and application logs.\n    app.logger.error(json.dumps({'event':'database_error','type':type(exc).__name__}))\n    message = ('Write outcome uncertain; check stored data before trying again'\n               if request.method=='POST' else 'Database temporarily unavailable')\n    return jsonify(error=message),503\n\n@app.after_request\ndef log_response(response):\n    app.logger.info(json.dumps({'event':'request','method':request.method,\n                               'path':request.path,'status':response.status_code}))\n    return response\n\nif __name__ == '__main__':\n    import sys\n    if sys.argv[1:] == ['migrate']:\n        migrate()\n        print('Schema and seed ready; existing stock preserved')\n    else:\n        raise SystemExit('Use: python app.py migrate OR gunicorn -b 127.0.0.1:8000 app:app')\n",
        "schema.sql": "CREATE TABLE IF NOT EXISTS books (\n  id INT PRIMARY KEY AUTO_INCREMENT,\n  title VARCHAR(200) NOT NULL,\n  author VARCHAR(200) NOT NULL,\n  stock INT NOT NULL CHECK (stock >= 0)\n) ENGINE=InnoDB;\n",
        "seed.sql": "INSERT IGNORE INTO books(id,title,author,stock) VALUES\n(1,'Pride and Prejudice','Jane Austen',10),\n(2,'Jane Eyre','Charlotte Bronte',10),\n(3,'Great Expectations','Charles Dickens',10),\n(4,'Frankenstein','Mary Shelley',10),\n(5,'Dracula','Bram Stoker',10),\n(6,'The Odyssey','Homer',10),\n(7,'The Time Machine','H. G. Wells',10),\n(8,'Treasure Island','Robert Louis Stevenson',10),\n(9,'Little Women','Louisa May Alcott',10),\n(10,'The Secret Garden','Frances Hodgson Burnett',10),\n(11,'Moby Dick','Herman Melville',10),\n(12,'The Adventures of Sherlock Holmes','Arthur Conan Doyle',10);\n",
        "shelflife.service": "[Unit]\nDescription=ShelfLife learning application\nAfter=network-online.target\nWants=network-online.target\n\n[Service]\nUser=appuser\nWorkingDirectory=/opt/app\nEnvironment=APP_MODE=aws\nEnvironment=DB_INSTANCE=shelflife-db\nEnvironment=AWS_DEFAULT_REGION=us-east-1\nExecStartPre=/opt/app/venv/bin/python /opt/app/app.py migrate\nExecStart=/opt/app/venv/bin/gunicorn -b 0.0.0.0:8000 -w 2 --access-logfile - --error-logfile - app:app\nRestart=on-failure\nRestartSec=15\nTimeoutStartSec=180\n\n[Install]\nWantedBy=multi-user.target\n",
        "env.sh": "# Source this file from the lab folder: source ./env.sh\nexport AWS_PROFILE=shelflife\nexport AWS_DEFAULT_REGION=us-east-1\nexport AWS_PAGER=''\nif [[ -f lab.env ]]; then\n  set -a\n  source ./lab.env\n  set +a\nfi\nrecord() {\n  [[ \"$1\" =~ ^[A-Z][A-Z0-9_]*$ && -n \"$2\" && \"$2\" != None ]] || return 1\n  printf '%s=%q\\n' \"$1\" \"$2\" >> lab.env\n  export \"$1=$2\"\n}\ncheck_account() {\n  local observed\n  observed=$(aws sts get-caller-identity --query Account --output text) || return 1\n  [[ -n \"${ACCOUNT_ID:-}\" && \"$observed\" == \"$ACCOUNT_ID\" ]] || {\n    echo 'STOP: account differs from lab.env. Check your sign-in.' >&2; return 1;\n  }\n}\n",
        "local-up.sh": "#!/usr/bin/env bash\nset -euo pipefail\ncd \"$(dirname \"$0\")\"\nif [[ ! -f local.env ]]; then\n  umask 077\n  python3 - <<'PY'\nimport secrets\nfrom pathlib import Path\nPath('local.env').write_text('MYSQL_DATABASE=shelflife\\nMYSQL_USER=shelflife\\n'\n    + 'MYSQL_PASSWORD='+secrets.token_hex(24)+'\\n'\n    + 'MYSQL_ROOT_PASSWORD='+secrets.token_hex(24)+'\\n')\nPY\nfi\nif podman container exists shelflife-mysql; then\n  podman start shelflife-mysql >/dev/null\nelse\n  podman run -d --name shelflife-mysql --env-file local.env \\\n    -p 127.0.0.1:3307:3306 docker.io/library/mysql:8.4\nfi\nset -a\nsource ./local.env\nset +a\nexport APP_MODE=local\npython3.11 -m venv .venv\n.venv/bin/pip install -r requirements.txt\n.venv/bin/pip freeze > requirements.lock.txt\nready=false\nfor attempt in $(seq 1 60); do\n  if .venv/bin/python app.py migrate; then ready=true; break; fi\n  sleep 5\ndone\n[[ \"$ready\" == true ]] || { echo 'MySQL not ready. Run: podman logs shelflife-mysql'; exit 1; }\nexec .venv/bin/gunicorn -b 127.0.0.1:8000 -w 2 --access-logfile - --error-logfile - app:app\n",
        "smoke.py": "import collections\nimport concurrent.futures\nimport json\nimport sys\nimport urllib.error\nimport urllib.request\n\nbase=sys.argv[1].rstrip('/') if len(sys.argv)>1 else 'http://127.0.0.1:8000'\ndef call(path, data=None):\n    req=urllib.request.Request(base+path,\n        data=json.dumps(data).encode() if data is not None else None,\n        headers={'Content-Type':'application/json'})\n    try:\n        with urllib.request.urlopen(req, timeout=20) as r:\n            return r.status,json.load(r)\n    except urllib.error.HTTPError as e:\n        return e.code,json.load(e)\nstatus,health=call('/health')\nassert status==200 and health['status']=='ok',(status,health)\nstatus,books=call('/books')\nassert status==200 and len(books)>=12,(status,books)\nstatus,created=call('/books',{'title':'Concurrency test','author':'Synthetic','stock':5})\nassert status==201,(status,created)\nbook_id=created['id']\nwith concurrent.futures.ThreadPoolExecutor(max_workers=10) as pool:\n    responses=list(pool.map(lambda _:call(f'/books/{book_id}/buy',{}),range(50)))\ncounts=collections.Counter(s for s,_ in responses)\nassert counts=={200:5,409:45},counts\n_,books=call('/books')\nassert next(b['stock'] for b in books if b['id']==book_id)==0\nprint('PASS: health, seed data, create; 50 buys = 5 successes + 45 sold-out responses; stock=0')\nprint('This creates one synthetic book. Each rerun uses a fresh book; original seed stock is unchanged.')\n",
        "deploy.sh": "#!/usr/bin/env bash\nset -euo pipefail\ncd \"$(dirname \"$0\")\"\nsource ./env.sh\ncheck_account\n: \"${BUCKET:?Complete the artifact bucket step first}\"\n[[ -s requirements.lock.txt ]] || { echo 'Run local-up.sh first'; exit 1; }\ncurl -fL --retry 3 https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem -o global-bundle.pem\n# The runtime uses the exact application dependency versions tested locally.\ncp requirements.lock.txt requirements-deploy.txt\ntar -czf app.tar.gz app.py schema.sql seed.sql requirements-deploy.txt shelflife.service global-bundle.pem\naws s3 cp app.tar.gz \"s3://$BUCKET/app.tar.gz\"\nif [[ \"${1:-}\" == '--refresh' ]]; then\n  aws autoscaling start-instance-refresh --auto-scaling-group-name shelflife-asg \\\n    --preferences '{\"MinHealthyPercentage\":50,\"InstanceWarmup\":180}'\nelse\n  echo 'Artifact uploaded. First deployment: continue to the instance-role step.'\nfi\n",
